<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل پذیرنده — TrafxPayment</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<script src="/assets/app.js"></script>
<script>
'use strict';
let me;

async function start() {
  try { me = await api('GET', '/api/panel/me'); }
  catch {
    await loginScreen({
      title: 'ورود پذیرندگان', role: 'merchant',
      subtitle: 'پرداخت رمزارزی را در چند دقیقه به کسب‌وکارتان اضافه کنید.',
      features: ['تایید خودکار پرداخت روی بلاکچین', 'USDT روی TRON، BNB Chain و TON', 'تسویه خودکار روزانه یا هفتگی', 'API و Webhook امن'],
    });
    me = await api('GET', '/api/panel/me');
  }
  createShell({
    product: 'TrafxPayment', subtitle: 'پنل پذیرنده',
    user: { name: me.merchant.name, role: me.merchant.email },
    onLogout: async () => { await api('POST', '/api/auth/logout'); location.reload(); },
    nav: [
      { id: 'dashboard', label: 'داشبورد', icon: 'dashboard' },
      { id: 'invoices', label: 'فاکتورها', icon: 'invoice' },
      { id: 'payouts', label: 'موجودی و تسویه', icon: 'payout' },
      { id: 'addresses', label: 'آدرس‌های تسویه', icon: 'wallet' },
      { section: 'توسعه‌دهندگان' },
      { id: 'developers', label: 'API و Webhook', icon: 'code' },
      { section: 'حساب' },
      { id: 'settings', label: 'تنظیمات', icon: 'settings' },
      { id: 'security', label: 'امنیت', icon: 'shield' },
    ],
    views: VIEWS,
  });
}

const assetOptions = (selected = '') => me.assets.map((a) => `<option value="${esc(a.id)}" ${a.id === selected ? 'selected' : ''}>${esc(a.symbol)} — ${esc(a.network_name)}</option>`).join('');
const settingOf = (asset) => me.asset_settings.find((s) => s.asset === asset) || {};

function invoiceRows(list) {
  return list.map((i) => [
    `<div><b>${fmtAmount(i.price_amount, 2)} ${esc(i.price_currency)}</b></div><div class="small muted">${esc(i.order_id ? '#' + i.order_id : short(i.id, 4))}</div>`,
    i.asset ? `${assetLabel(i.asset)}<div class="small muted">${num(fmtAmount(i.pay_amount))}</div>` : '<span class="muted">انتخاب نشده</span>',
    num(fmtAmount(i.amount_received)),
    badge(i.status) + (i.is_late ? ' <span class="badge plain b-warn">دیرهنگام</span>' : ''),
    `<span class="small text-2">${fmtDate(i.created_at)}</span>`,
    `<div class="row" style="flex-wrap:nowrap"><button class="btn sm secondary" data-inv="${esc(i.id)}">جزئیات</button><a class="btn sm ghost icon" href="${esc(i.payment_url)}" target="_blank" title="صفحه پرداخت">${icon('external')}</a></div>`,
  ]);
}
const INVOICE_HEAD = ['مبلغ', 'ارز پرداخت', 'دریافتی', 'وضعیت', 'تاریخ', ''];

async function invoiceDetail(id) {
  const i = await api('GET', `/api/panel/invoices/${id}`);
  const rows = [
    ['وضعیت', badge(i.status)], ['مبلغ فاکتور', `${fmtAmount(i.price_amount, 2)} ${esc(i.price_currency)}`],
    ['ارز / شبکه', i.asset ? `${assetLabel(i.asset)} · ${esc(NETWORK[i.network] || i.network)}` : '—'],
    ['مبلغ قابل پرداخت', num(fmtAmount(i.pay_amount))], ['دریافتی', num(fmtAmount(i.amount_received))],
    ['کارمزد درگاه', num(fmtAmount(i.fee_amount))], ['کارمزد شبکه', `${num(fmtAmount(i.network_fee))} <span class="muted small">${i.fee_paid_by === 'customer' ? '(پرداخت توسط مشتری)' : ''}</span>`],
    ['خالص شما', `<b>${num(fmtAmount(i.net_amount))}</b>`], ['شناسه سفارش', esc(i.order_id || '—')], ['شناسه مشتری', esc(i.customer_id || '—')],
    ['آدرس', i.address ? `<span class="mono small">${esc(i.address)}</span>` : '—'], ['ایجاد', fmtDate(i.created_at)], ['پرداخت', fmtDate(i.paid_at)],
  ];
  await modal({
    title: 'جزئیات فاکتور', ico: 'invoice',
    body: `<div style="max-height:62vh;overflow:auto">${table(['', ''], rows)}
      <h3 style="margin:14px 0 6px">تراکنش‌ها</h3>
      ${table(['هش', 'مبلغ', 'تایید', 'وضعیت'], (i.deposits || []).map((d) => [`<span class="mono small">${esc(short(d.tx_hash, 8))}</span>`, num(fmtAmount(d.amount)), num(d.confirmations), badge(d.status)]), { empty: 'هنوز تراکنشی نرسیده' })}
      <div style="margin-top:10px">${copyField(i.payment_url, { label: 'کپی لینک' })}</div></div>`,
    buttons: i.status === 'pending' && !(i.deposits || []).length
      ? [{ label: 'لغو فاکتور', value: 'cancel', cls: 'danger soft' }, { label: 'بستن', value: null }]
      : [{ label: 'بستن', value: null }],
  }).then(async (v) => {
    if (v === 'cancel' && await confirmDialog('لغو فاکتور', 'این فاکتور لغو شود؟', { danger: true, ok: 'لغو فاکتور' })) {
      await api('POST', `/api/panel/invoices/${id}/cancel`); toast('فاکتور لغو شد'); location.hash === '#invoices' ? VIEWS.invoices($('#view')) : null;
    }
  });
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-inv]'); if (b) invoiceDetail(b.dataset.inv).catch((err) => toast(err.message, 'err')); });

async function newInvoiceDialog() {
  const d = await modal({
    title: 'ساخت لینک پرداخت', ico: 'plus',
    body: `<form id="ni" class="stack">
      <div class="grid grid-2">${field('مبلغ', '<input name="price_amount" class="ltr" required placeholder="25">')}${field('واحد', '<select name="price_currency"><option>USD</option><option>USDT</option><option>EUR</option></select>')}</div>
      ${field('ارز پرداخت', `<select name="asset"><option value="">انتخاب توسط مشتری (پیشنهادی)</option>${assetOptions()}</select>`)}
      ${field('توضیحات', '<input name="description" placeholder="مثلاً: اشتراک یک‌ماهه">')}
      ${field('شناسه مشتری (اختیاری)', '<input name="customer_id" class="ltr" placeholder="user-42">', 'برای مشتری‌های تکراری؛ هر مشتری یک آدرس دائمی می‌گیرد')}
    </form>`,
    buttons: [{ label: 'انصراف', value: null }, { label: 'ساخت لینک', value: (w) => formData($('#ni', w)) }],
  });
  if (!d) return;
  for (const k of ['asset', 'description', 'customer_id']) if (!d[k]) delete d[k];
  try {
    const r = await api('POST', '/api/panel/invoices', d);
    await modal({ title: 'لینک پرداخت آماده است', ico: 'checkCircle', body: `<p>این لینک را برای مشتری بفرستید:</p>${copyField(r.payment_url, { label: 'کپی لینک' })}`, buttons: [{ label: 'باز کردن', value: () => window.open(r.payment_url, '_blank'), cls: 'secondary' }, { label: 'بستن', value: null }] });
    if (location.hash === '#invoices') VIEWS.invoices($('#view'));
  } catch (e) { toast(e.message, 'err'); }
}

const VIEWS = {
  async dashboard(el, ctx) {
    ctx.setHeader('داشبورد', `خوش آمدید، ${esc(me.merchant.name)}`, `<button class="btn" id="hdr-new">${icon('plus')}لینک پرداخت</button>`);
    $('#hdr-new').onclick = newInvoiceDialog;
    const [bal, inv, addrs, keys] = await Promise.all([
      api('GET', '/api/panel/balances'), api('GET', '/api/panel/invoices?limit=100'),
      api('GET', '/api/panel/payout-addresses'), api('GET', '/api/panel/api-keys'),
    ]);
    const list = inv.data;
    const today = new Date().toDateString();
    const paid = list.filter((i) => i.status === 'paid');
    const usdVolume = paid.filter((i) => ['USD', 'USDT'].includes(i.price_currency)).reduce((s, i) => s + Number(i.price_amount), 0);
    const steps = [
      [addrs.data.length > 0, 'آدرس کیف پول برای تسویه ثبت کنید', 'addresses'],
      [keys.data.some((k) => !k.revoked_at), 'کلید API بسازید', 'developers'],
      [!!me.merchant.webhook_url, 'آدرس Webhook سایت خود را وارد کنید', 'developers'],
      [me.merchant.totp_enabled, 'تایید دومرحله‌ای را فعال کنید', 'security'],
    ];
    const done = steps.filter((s) => s[0]).length;
    el.innerHTML = `
      ${done < steps.length ? card({ title: 'راه‌اندازی حساب', desc: `${done} از ${steps.length} مرحله انجام شده`, body: `<div class="stack">${steps.map(([ok, t, v]) => `<div class="row">${ok ? `<span class="badge b-ok">انجام شد</span>` : `<span class="badge b-warn">مانده</span>`}<span class="${ok ? 'muted' : ''}">${t}</span>${ok ? '' : `<a class="btn sm secondary" href="#${v}" style="margin-inline-start:auto">انجام</a>`}</div>`).join('')}</div>` }) : ''}
      <div class="grid grid-4" style="margin-bottom:18px">
        ${kpi({ label: 'حجم پرداخت‌ها (دلاری)', value: fmtAmount(usdVolume.toFixed(2), 2), unit: 'USD', ico: 'trend', hint: `${paid.length} فاکتور پرداخت‌شده` })}
        ${kpi({ label: 'پرداخت‌های امروز', value: paid.filter((i) => new Date(i.paid_at).toDateString() === today).length, ico: 'checkCircle', tone: 'ok' })}
        ${kpi({ label: 'در انتظار پرداخت', value: list.filter((i) => ['pending', 'confirming'].includes(i.status)).length, ico: 'clock', tone: 'warn' })}
        ${kpi({ label: 'کارمزد درگاه', value: `${esc(me.merchant.fee_percent.replace(/\.?0+$/, ''))}٪`, ico: 'coins', hint: `تسویه ${SCHEDULE[me.merchant.settlement_schedule]}` })}
      </div>
      <div class="grid grid-main">
        ${card({ title: 'آخرین فاکتورها', actions: '<a class="btn sm secondary" href="#invoices">همه</a>', flush: true, body: table(INVOICE_HEAD, invoiceRows(list.slice(0, 8)), { empty: 'هنوز فاکتوری ساخته نشده' }) })}
        ${card({ title: 'موجودی قابل تسویه', actions: '<a class="btn sm secondary" href="#payouts">تسویه</a>', body: bal.data.length ? `<div class="stack">${bal.data.map((b) => `<div class="row"><span>${assetLabel(b.asset)}</span><span class="spacer"></span><b class="num">${fmtAmount(b.balance)}</b></div>`).join('')}</div>` : '<div class="empty">' + icon('wallet') + '<div>هنوز موجودی ندارید</div></div>' })}
      </div>`;
  },

  async invoices(el, ctx, status = '') {
    ctx?.setHeader('فاکتورها', 'همه پرداخت‌های شما', `<button class="btn" id="hdr-new">${icon('plus')}لینک پرداخت</button>`);
    if (ctx) $('#hdr-new').onclick = newInvoiceDialog;
    const r = await api('GET', `/api/panel/invoices?limit=100${status ? '&status=' + status : ''}`);
    const tabs = [['', 'همه'], ['paid', 'پرداخت شده'], ['pending', 'در انتظار'], ['confirming', 'در حال تایید'], ['partially_paid', 'ناقص'], ['expired', 'منقضی']];
    el.innerHTML = card({
      flush: true,
      body: `<div class="tabs" style="padding:0 12px;margin:0">${tabs.map(([k, t]) => `<button data-st="${k}" class="${k === status ? 'active' : ''}">${t}</button>`).join('')}</div>
        ${table(INVOICE_HEAD, invoiceRows(r.data), { empty: 'فاکتوری با این وضعیت نیست' })}`,
    });
    $$('[data-st]', el).forEach((b) => b.addEventListener('click', () => VIEWS.invoices(el, null, b.dataset.st)));
  },

  async payouts(el, ctx) {
    ctx.setHeader('موجودی و تسویه', `تسویه ${SCHEDULE[me.merchant.settlement_schedule]} ساعت ${me.settlement_hour_utc}:00 UTC`);
    const [bal, p, l] = await Promise.all([api('GET', '/api/panel/balances'), api('GET', '/api/panel/payouts'), api('GET', '/api/panel/ledger')]);
    el.innerHTML = `
      <div class="grid grid-3" style="margin-bottom:18px">
        ${bal.data.map((b) => `<div class="kpi"><div class="label"><span class="ico">${icon('coins')}</span>${assetLabel(b.asset)}</div>
          <div class="value num">${fmtAmount(b.balance)}</div>
          <div class="row" style="margin-top:10px"><span class="small muted">کارمزد شبکه تسویه: ${esc(settingOf(b.asset).payout_fee || '0')}</span><span class="spacer"></span>
          <button class="btn sm" data-req="${esc(b.asset)}" ${Number(b.balance) > 0 ? '' : 'disabled'}>تسویه فوری</button></div></div>`).join('') || `<div class="kpi">${alertBox('info', 'هنوز موجودی ندارید.')}</div>`}
      </div>
      ${card({ title: 'تاریخچه تسویه', flush: true, body: table(['تاریخ', 'ارز', 'مبلغ', 'کارمزد شبکه', 'مقصد', 'وضعیت', 'تراکنش'], p.data.map((x) => [fmtDate(x.created_at), assetLabel(x.asset), `<b class="num">${fmtAmount(x.amount)}</b>`, num(fmtAmount(x.fee)), `<span class="mono small">${esc(short(x.address))}</span>`, badge(x.status), x.tx_hash ? `<span class="mono small">${esc(short(x.tx_hash, 8))}</span>` : '—']), { empty: 'هنوز تسویه‌ای انجام نشده' }) })}
      ${card({ title: 'گردش حساب', desc: 'همه ورود و خروج‌های موجودی شما', flush: true, body: table(['تاریخ', 'نوع', 'ارز', 'مبلغ', 'توضیح'], l.data.map((x) => [fmtDate(x.created_at), esc(LEDGER[x.type] || x.type), assetLabel(x.asset), `<b class="num" style="color:${String(x.amount).startsWith('-') ? 'var(--err)' : 'var(--ok)'}">${fmtAmount(x.amount)}</b>`, `<span class="small muted">${esc(x.note || '')}</span>`]), { empty: 'گردشی ثبت نشده' }) })}`;
    $$('[data-req]', el).forEach((b) => b.addEventListener('click', async () => {
      const a = b.dataset.req;
      if (!(await confirmDialog('درخواست تسویه', `کل موجودی ${a} منهای کارمزد شبکه (${esc(settingOf(a).payout_fee)}) به آدرس تسویه شما فرستاده می‌شود.`))) return;
      await busy(b, async () => { await api('POST', '/api/panel/payouts', { asset: a }); toast('درخواست تسویه ثبت شد'); VIEWS.payouts(el, ctx); });
    }));
  },

  async addresses(el, ctx) {
    ctx.setHeader('آدرس‌های تسویه', 'موجودی هر ارز به آدرس همان ارز فرستاده می‌شود', `<button class="btn" id="add-addr">${icon('plus')}افزودن آدرس</button>`);
    const a = await api('GET', '/api/panel/payout-addresses');
    el.innerHTML = `${alertBox('info', 'برای امنیت، بعد از <b>تغییر</b> آدرس تسویه، تا ۲۴ ساعت به آدرس جدید تسویه‌ای فرستاده نمی‌شود.', 'lock')}<div style="height:14px"></div>
      ${card({ flush: true, body: table(['ارز', 'آدرس', 'حداقل مبلغ تسویه', 'کارمزد شبکه', 'وضعیت', ''], a.data.map((x) => {
        const held = x.locked_until && new Date(x.locked_until) > new Date();
        return [assetLabel(x.asset), `<span class="mono small">${esc(x.address)}</span>`, num(fmtAmount(x.min_amount)), num(settingOf(x.asset).payout_fee || '0'),
          held ? `<span class="badge b-warn">تا ${fmtDate(x.locked_until)} در انتظار</span>` : '<span class="badge b-ok">فعال</span>',
          `<div class="row" style="flex-wrap:nowrap"><button class="btn sm secondary" data-edit="${esc(x.asset)}">ویرایش</button><button class="btn sm ghost icon" data-del="${esc(x.asset)}" title="حذف">${icon('x')}</button></div>`];
      }), { empty: 'هنوز آدرسی ثبت نکرده‌اید', emptyIcon: 'wallet' }) })}`;
    const edit = async (asset = '') => {
      const cur = a.data.find((x) => x.asset === asset);
      const d = await modal({
        title: cur ? `ویرایش آدرس ${asset}` : 'افزودن آدرس تسویه', ico: 'wallet',
        body: `<form id="af" class="stack">${field('ارز', `<select name="asset" ${cur ? 'disabled' : ''}>${assetOptions(asset)}</select>`)}
          ${field('آدرس کیف پول', `<input name="address" class="ltr" required value="${esc(cur?.address || '')}">`, 'فقط آدرس همین شبکه؛ آدرس اشتباه یعنی از دست رفتن وجه')}
          ${field('حداقل مبلغ تسویه', `<input name="min_amount" class="ltr" value="${esc(cur?.min_amount || '0')}">`, 'موجودی کمتر از این به دوره بعد منتقل می‌شود')}</form>`,
        buttons: [{ label: 'انصراف', value: null }, { label: 'ذخیره', value: (w) => ({ ...formData($('#af', w)), asset: asset || $('#af [name=asset]', w).value }) }],
      });
      if (!d) return;
      try {
        const r = await api('PUT', '/api/panel/payout-addresses', d);
        toast(r.held_hours ? `ذخیره شد؛ تسویه به آدرس جدید از ${r.held_hours} ساعت دیگر` : 'ذخیره شد');
        VIEWS.addresses(el, ctx);
      } catch (e) { toast(e.message, 'err'); }
    };
    $('#add-addr').onclick = () => edit();
    $$('[data-edit]', el).forEach((b) => b.addEventListener('click', () => edit(b.dataset.edit)));
    $$('[data-del]', el).forEach((b) => b.addEventListener('click', async () => {
      if (!(await confirmDialog('حذف آدرس', `آدرس تسویه ${esc(b.dataset.del)} حذف شود؟`, { danger: true, ok: 'حذف' }))) return;
      try { await api('DELETE', `/api/panel/payout-addresses/${b.dataset.del}`); toast('حذف شد'); VIEWS.addresses(el, ctx); } catch (e) { toast(e.message, 'err'); }
    }));
  },

  async developers(el, ctx) {
    ctx.setHeader('API و Webhook', 'اتصال سایت یا اپلیکیشن شما به درگاه');
    const k = await api('GET', '/api/panel/api-keys');
    const base = location.origin;
    el.innerHTML = `
      ${card({ title: 'کلیدهای API', desc: 'هر کلید را فقط در سرور خود نگه دارید', actions: `<button class="btn sm" id="new-key">${icon('plus')}کلید جدید</button>`, flush: true,
        body: table(['نام', 'کلید', 'IPهای مجاز', 'آخرین استفاده', 'وضعیت', ''], k.data.map((x) => [
          `<b>${esc(x.label)}</b>`, `<span class="mono small">${esc(x.key_prefix)}…</span>`,
          x.allowed_ips?.length ? `<span class="mono small">${esc(x.allowed_ips.join(', '))}</span>` : '<span class="muted small">همه</span>',
          fmtDate(x.last_used_at), x.revoked_at ? '<span class="badge b-muted">باطل شده</span>' : '<span class="badge b-ok">فعال</span>',
          x.revoked_at ? '' : `<div class="row" style="flex-wrap:nowrap"><button class="btn sm secondary" data-ips="${esc(x.id)}">IPها</button><button class="btn sm danger soft" data-revoke="${esc(x.id)}">ابطال</button></div>`,
        ]), { empty: 'هنوز کلیدی نساخته‌اید', emptyIcon: 'key' }) })}
      ${card({ title: 'Webhook', desc: 'درگاه نتیجه پرداخت را به این آدرس POST می‌کند', body: `
        <form id="wh" class="form-grid" style="grid-template-columns:1fr auto">${field('آدرس Webhook', `<input name="webhook_url" class="ltr" placeholder="https://yoursite.com/payment/callback" value="${esc(me.merchant.webhook_url || '')}">`)}<button class="btn">ذخیره</button></form>
        <div class="row" style="margin-top:14px"><span class="text-2">کلید امضای Webhook</span><span class="spacer"></span><button class="btn sm secondary" id="show-secret">نمایش</button><button class="btn sm danger soft" id="rotate-secret">تعویض</button></div>
        <div id="secret" style="margin-top:8px"></div>` })}
      ${card({ title: 'راهنمای اتصال', body: `
        <p>۱) یک کلید API بسازید. ۲) برای هر سفارش فاکتور بسازید و مشتری را به <code>payment_url</code> هدایت کنید. ۳) نتیجه را از Webhook بگیرید و امضای آن را بررسی کنید.</p>
        <h3>ساخت فاکتور</h3>
<pre>curl -X POST ${esc(base)}/v1/invoices \\
  -H "Authorization: Bearer txp_..." -H "Content-Type: application/json" \\
  -d '{"price_amount":"25","price_currency":"USD","order_id":"1001",
       "customer_id":"user-42","success_url":"https://shop.example/thanks"}'</pre>
        <div class="stack small">
          ${alertBox('info', '<b>customer_id</b> را برای کاربران تکراری بفرستید (بروکر، شارژ حساب، اشتراک): هر کاربر یک آدرس دائمی می‌گیرد. برای خریدهای یک‌باره نفرستید.')}
          ${alertBox('warn', '<b>امنیت:</b> customer_id را همیشه از جلسه کاربرِ واردشده در سرور خودتان بفرستید، نه از ورودی کاربر.')}
        </div>
        <h3 style="margin-top:14px">بررسی امضای Webhook</h3>
<pre>// Node.js
const sig = crypto.createHmac('sha256', WEBHOOK_SECRET)
  .update(req.headers['x-webhook-timestamp'] + '.' + rawBody).digest('hex');
