<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafxPayment</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script>
'use strict';
let me;

async function start() {
  try { me = await api('GET', '/api/panel/me'); }
  catch {
    await loginScreen({ title: t('auth.merchantTitle'), pitch: t('auth.merchantPitch'), role: 'merchant' });
    me = await api('GET', '/api/panel/me');
  }
  createShell({
    subtitle: t('m.panel'),
    user: { name: me.merchant.name, role: me.merchant.email },
    onLogout: async () => { await api('POST', '/api/auth/logout'); location.reload(); },
    nav: [
      { id: 'dashboard', label: t('m.nav.dashboard'), icon: 'dashboard' },
      { id: 'invoices', label: t('m.nav.invoices'), icon: 'invoice' },
      { id: 'payouts', label: t('m.nav.payouts'), icon: 'payout' },
      { id: 'addresses', label: t('m.nav.addresses'), icon: 'wallet' },
      { section: t('m.nav.secDev') },
      { id: 'developers', label: t('m.nav.dev'), icon: 'code' },
      { id: 'apidocs', label: t('m.nav.apidocs'), icon: 'code' },
      { section: t('m.nav.secAccount') },
      { id: 'settings', label: t('m.nav.settings'), icon: 'settings' },
      { id: 'security', label: t('m.nav.security'), icon: 'shield' },
    ],
    views: VIEWS,
  });
}

const assetOptions = (selected = '') => me.assets.map((a) => `<option value="${esc(a.id)}" ${a.id === selected ? 'selected' : ''}>${esc(a.symbol)} · ${esc(a.network_name)}</option>`).join('');
const settingOf = (asset) => me.asset_settings.find((s) => s.asset === asset) || {};
const newLinkBtn = () => `<button class="btn" id="hdr-new">${icon('plus')}<span class="btn-text">${esc(t('m.newLink'))}</span></button>`;
const bindNewLink = () => { $('#hdr-new').onclick = newInvoiceDialog; };

const INVOICE_HEAD = () => [t('inv.price'), t('inv.payAsset'), t('inv.received'), t('common.status'), t('common.date'), ''];
function invoiceRows(list) {
  return list.map((i) => [
    `<span class="num strong">${esc(fmtAmount(i.price_amount, 2))}</span> <span class="muted small">${esc(i.price_currency)}</span><span class="sub">${esc(i.order_id ? '#' + i.order_id : short(i.id, 4))}</span>`,
    i.asset ? `${assetLabel(i.asset)}<span class="sub"><span class="num">${esc(fmtAmount(i.pay_amount))}</span></span>` : `<span class="muted">${esc(t('inv.notChosen'))}</span>`,
    num(i.amount_received),
    badge(i.status) + (i.is_late ? ` <span class="badge plain b-warn">${esc(t('st.late'))}</span>` : ''),
    `<span class="small text-2">${fmtDate(i.created_at)}</span>`,
    `<div class="row" style="flex-wrap:nowrap;justify-content:flex-end"><button class="btn sm secondary" data-inv="${esc(i.id)}">${esc(t('common.details'))}</button><a class="btn sm ghost icon" href="${esc(i.payment_url)}" target="_blank" rel="noopener" title="${esc(t('inv.openPage'))}" aria-label="${esc(t('inv.openPage'))}">${icon('external')}</a></div>`,
  ]);
}

async function invoiceDetail(id) {
  const i = await api('GET', `/api/panel/invoices/${id}`);
  const kv = [
    [t('common.status'), badge(i.status)],
    [t('inv.price'), `${num(i.price_amount, 2)} ${esc(i.price_currency)}`],
    [`${t('common.asset')} / ${t('common.network')}`, i.asset ? `${assetLabel(i.asset)} · ${esc(NETWORK[i.network] || i.network)}` : '—'],
    [t('inv.payable'), num(i.pay_amount)], [t('inv.received'), num(i.amount_received)],
    [t('inv.gwFee'), num(i.fee_amount)], [t('inv.netFee'), `${num(i.network_fee)} <span class="muted small">${i.fee_paid_by === 'customer' ? esc(t('inv.byCustomer')) : ''}</span>`],
    [t('inv.net'), `<b>${num(i.net_amount)}</b>`], [t('inv.orderId'), esc(i.order_id || '—')], [t('inv.customerId'), esc(i.customer_id || '—')],
    [t('common.address'), i.address ? `<span class="mono small" style="word-break:break-all">${esc(i.address)}</span>` : '—'],
    [t('inv.created'), fmtDate(i.created_at)], [t('inv.paidAt'), fmtDate(i.paid_at)],
  ];
  const canCancel = i.status === 'pending' && !(i.deposits || []).length;
  const v = await modal({
    title: t('inv.detail'), ico: 'invoice', wide: true,
    body: `<div class="stack"><table class="kv-table"><tbody>${kv.map(([k, val]) => `<tr><td>${esc(k)}</td><td>${val}</td></tr>`).join('')}</tbody></table>
      <h3>${esc(t('inv.txs'))}</h3>
      <div class="panel">${table([t('inv.hash'), t('common.amount'), t('inv.confs'), t('common.status')], (i.deposits || []).map((d) => [`<span class="mono small">${esc(short(d.tx_hash, 8))}</span>`, num(d.amount), `<span class="num">${esc(d.confirmations)}</span>`, badge(d.status)]), { empty: t('inv.noTx') })}</div>
      ${copyField(i.payment_url, { label: t('inv.copyLink') })}</div>`,
    buttons: canCancel ? [{ label: t('inv.cancel'), value: 'cancel', cls: 'danger-soft' }, { label: t('common.close'), value: null }] : [{ label: t('common.close'), value: null }],
  });
  if (v === 'cancel' && await confirmDialog(t('inv.cancel'), esc(t('inv.cancelQ')), { danger: true, ok: t('inv.cancel') })) {
    try { await api('POST', `/api/panel/invoices/${id}/cancel`); toast(t('inv.cancelled')); window.dispatchEvent(new HashChangeEvent('hashchange')); } catch (e) { toast(errText(e), 'err'); }
  }
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-inv]'); if (b) invoiceDetail(b.dataset.inv).catch((err) => toast(errText(err), 'err')); });

async function newInvoiceDialog() {
  const d = await modal({
    title: t('inv.new'), ico: 'plus',
    body: `<form id="ni" class="stack">
      <div class="grid grid-2">${field(t('common.amount'), '<input id="ni-amount" name="price_amount" class="ltr" required inputmode="decimal" placeholder="25">')}${field(t('inv.unit'), '<select id="ni-cur" name="price_currency"><option>USD</option><option>USDT</option><option>EUR</option></select>')}</div>
      ${field(t('inv.payAsset'), `<select id="ni-asset" name="asset"><option value="">${esc(t('inv.chooseByCustomer'))}</option>${assetOptions()}</select>`)}
      ${field(t('inv.desc'), `<input id="ni-desc" name="description" placeholder="${esc(t('inv.descPh'))}">`)}
      ${field(`${t('inv.customerId')} <span class="muted">(${esc(t('common.optional'))})</span>`, '<input id="ni-cust" name="customer_id" class="ltr" placeholder="user-42">', esc(t('inv.custHelp')))}
    </form>`,
    buttons: [{ label: t('common.cancel'), value: null }, { label: t('inv.create'), value: (w) => formData($('#ni', w)) }],
  });
  if (!d) return;
  for (const k of ['asset', 'description', 'customer_id']) if (!d[k]) delete d[k];
  try {
    const r = await api('POST', '/api/panel/invoices', d);
    await modal({
      title: t('inv.ready'), ico: 'checkCircle',
      body: `<div class="stack"><p>${esc(t('inv.sendLink'))}</p>${copyField(r.payment_url, { label: t('inv.copyLink') })}</div>`,
      buttons: [{ label: t('inv.open'), value: () => window.open(r.payment_url, '_blank', 'noopener'), cls: 'secondary' }, { label: t('common.close'), value: null }],
    });
    window.dispatchEvent(new HashChangeEvent('hashchange'));
  } catch (e) { toast(errText(e), 'err'); }
}

const VIEWS = {
  async dashboard(el, ctx) {
    ctx.setHeader(t('m.nav.dashboard'), esc(t('m.welcome', { name: me.merchant.name })), newLinkBtn());
    bindNewLink();
    const [bal, inv, addrs, keys, st] = await Promise.all([
      api('GET', '/api/panel/balances'), api('GET', '/api/panel/invoices?limit=100'),
      api('GET', '/api/panel/payout-addresses'), api('GET', '/api/panel/api-keys'), api('GET', '/api/panel/stats?days=14'),
    ]);
    const list = inv.data;
    const paid = list.filter((i) => i.status === 'paid');
    const usd = paid.filter((i) => ['USD', 'USDT'].includes(i.price_currency)).reduce((s, i) => s + Number(i.price_amount), 0);
    const today = new Date().toDateString();
    const steps = [
      [addrs.data.length > 0, t('m.setup.address'), 'addresses'],
      [keys.data.some((k) => !k.revoked_at), t('m.setup.key'), 'developers'],
      [!!me.merchant.webhook_url, t('m.setup.webhook'), 'developers'],
      [me.merchant.totp_enabled, t('m.setup.tfa'), 'security'],
    ];
    const done = steps.filter((s) => s[0]).length;
    el.innerHTML = `
      ${done < steps.length ? panel({
        title: t('m.setup'), desc: t('m.setupProgress', { done, total: steps.length }),
        body: `<div class="stack"><div class="progress"><div style="width:${(done / steps.length) * 100}%"></div></div>
          <div class="checklist">${steps.map(([ok, label, v]) => `<div class="item ${ok ? 'done' : ''}"><span class="tick">${icon('check')}</span><span class="label">${esc(label)}</span>${ok ? '' : `<a class="btn sm secondary" href="#${v}" style="margin-inline-start:auto">${esc(t('common.do'))}</a>`}</div>`).join('')}</div></div>`,
      }) : ''}
      ${stats([
        { label: t('m.kpi.volume'), value: esc(fmtAmount(usd.toFixed(2), 2)), ico: 'trend', hint: esc(t('m.kpi.paidCount', { n: paid.length })) },
        { label: t('m.kpi.today'), value: paid.filter((i) => new Date(i.paid_at).toDateString() === today).length, ico: 'checkCircle' },
        { label: t('m.kpi.open'), value: list.filter((i) => ['pending', 'confirming', 'partially_paid'].includes(i.status)).length, ico: 'clock' },
        { label: t('m.kpi.fee'), value: esc(String(me.merchant.fee_percent).replace(/\.?0+$/, '')) + '%', ico: 'coins', hint: esc(t('m.kpi.settle', { s: t('sch.' + me.merchant.settlement_schedule) })) },
      ])}
      <div class="grid grid-main">
        ${volumePanel(st.data)}
        ${panel({ title: t('m.balances'), actions: `<a class="btn sm secondary" href="#payouts">${esc(t('m.settleBtn'))}</a>`, flush: true,
          body: table([t('common.asset'), t('common.amount')], bal.data.map((b) => [assetLabel(b.asset), `<b>${num(b.balance)}</b>`]), { empty: t('m.noBalance'), emptyIcon: 'wallet', end: [1] }) })}
      </div>
      ${panel({ title: t('m.recent'), actions: `<a class="btn sm secondary" href="#invoices">${esc(t('common.all'))}</a>`, flush: true, body: table(INVOICE_HEAD(), invoiceRows(list.slice(0, 8)), { empty: t('m.noInvoices') }) })}`;
  },

  async invoices(el, ctx, status = '') {
    if (ctx) { ctx.setHeader(t('inv.title'), esc(t('inv.sub')), newLinkBtn()); bindNewLink(); }
    const r = await api('GET', `/api/panel/invoices?limit=100${status ? '&status=' + status : ''}`);
    el.innerHTML = panel({ flush: true, body: `${tabsBar([['', t('common.all')], ['paid', t('inv.tab.paid')], ['pending', t('inv.tab.pending')], ['confirming', t('inv.tab.confirming')], ['partially_paid', t('inv.tab.partial')], ['expired', t('inv.tab.expired')]], status)}
      ${table(INVOICE_HEAD(), invoiceRows(r.data), { empty: t('inv.empty') })}` });
    $$('[data-tab]', el).forEach((b) => b.addEventListener('click', () => VIEWS.invoices(el, null, b.dataset.tab)));
  },

  async payouts(el, ctx) {
    ctx.setHeader(t('po.title'), esc(t('po.sub', { s: t('sch.' + me.merchant.settlement_schedule), h: me.settlement_hour_utc })));
    const [bal, p, l] = await Promise.all([api('GET', '/api/panel/balances'), api('GET', '/api/panel/payouts'), api('GET', '/api/panel/ledger')]);
    el.innerHTML = `
      ${panel({ title: t('m.balances'), flush: true, body: table([t('common.asset'), t('common.amount'), t('inv.netFee'), ''], bal.data.map((b) => [
        assetLabel(b.asset), `<b>${num(b.balance)}</b>`, num(settingOf(b.asset).payout_fee || '0'),
        `<button class="btn sm" data-req="${esc(b.asset)}" ${Number(b.balance) > Number(settingOf(b.asset).payout_fee || 0) ? '' : 'disabled'}>${esc(t('po.instant'))}</button>`,
      ]), { empty: t('m.noBalance'), emptyIcon: 'wallet', end: [1, 2, 3] }) })}
      ${panel({ title: t('po.history'), flush: true, body: table([t('common.date'), t('common.asset'), t('common.amount'), t('inv.netFee'), t('po.dest'), t('common.status'), t('po.tx')], p.data.map((x) => [
        `<span class="small text-2">${fmtDate(x.created_at)}</span>`, assetLabel(x.asset), `<b>${num(x.amount)}</b>`, num(x.fee), `<span class="mono small">${esc(short(x.address))}</span>`, badge(x.status),
        x.tx_hash ? `<span class="mono small">${esc(short(x.tx_hash, 8))}</span>` : '—']), { empty: t('po.noHistory'), emptyIcon: 'payout', end: [2, 3] }) })}
      ${panel({ title: t('po.ledger'), desc: t('po.ledgerSub'), flush: true, body: table([t('common.date'), t('po.type'), t('common.asset'), t('common.amount'), t('po.note')], l.data.map((x) => [
        `<span class="small text-2">${fmtDate(x.created_at)}</span>`, esc(t('lg.' + x.type)), assetLabel(x.asset),
        `<b class="num" style="color:${String(x.amount).startsWith('-') ? 'var(--err)' : 'var(--ok)'}">${esc(fmtAmount(x.amount))}</b>`, `<span class="small muted">${esc(x.note || '')}</span>`]), { empty: t('po.noLedger'), end: [3] }) })}`;
    $$('[data-req]', el).forEach((b) => b.addEventListener('click', async () => {
      const a = b.dataset.req;
      if (!(await confirmDialog(t('po.reqTitle'), esc(t('po.reqText', { a, f: settingOf(a).payout_fee || '0' }))))) return;
      await busy(b, async () => { await api('POST', '/api/panel/payouts', { asset: a }); toast(t('po.requested')); VIEWS.payouts(el, ctx); });
    }));
  },

  async addresses(el, ctx) {
    ctx.setHeader(t('ad.title'), esc(t('ad.sub')), `<button class="btn" id="add-addr">${icon('plus')}<span class="btn-text">${esc(t('ad.add'))}</span></button>`);
    const a = await api('GET', '/api/panel/payout-addresses');
    el.innerHTML = `${alertBox('info', t('ad.hold'), 'lock')}
      ${panel({ flush: true, body: table([t('common.asset'), t('common.address'), t('ad.min'), t('inv.netFee'), t('common.status'), ''], a.data.map((x) => {
        const held = x.locked_until && new Date(x.locked_until) > new Date();
        return [assetLabel(x.asset), `<span class="mono small">${esc(x.address)}</span>`, num(x.min_amount), num(settingOf(x.asset).payout_fee || '0'),
          held ? `<span class="badge b-warn">${esc(t('st.held'))} · ${esc(t('ad.until', { d: fmtDate(x.locked_until) }))}</span>` : `<span class="badge b-ok">${esc(t('common.active'))}</span>`,
          `<div class="row" style="flex-wrap:nowrap;justify-content:flex-end"><button class="btn sm secondary" data-edit="${esc(x.asset)}">${esc(t('common.edit'))}</button><button class="btn sm ghost icon" data-del="${esc(x.asset)}" title="${esc(t('common.delete'))}" aria-label="${esc(t('common.delete'))}">${icon('x')}</button></div>`];
      }), { empty: t('ad.empty'), emptyIcon: 'wallet', end: [2, 3] }) })}`;
    const edit = async (asset = '') => {
      const cur = a.data.find((x) => x.asset === asset);
      const d = await modal({
        title: cur ? t('ad.editTitle', { a: asset }) : t('ad.addTitle'), ico: 'wallet',
        body: `<form id="af" class="stack">${field(t('common.asset'), `<select id="af-asset" name="asset" ${cur ? 'disabled' : ''}>${assetOptions(asset)}</select>`)}
          ${field(t('ad.wallet'), `<input id="af-addr" name="address" class="ltr" required value="${esc(cur?.address || '')}">`, esc(t('ad.walletHelp')))}
          ${field(t('ad.min'), `<input id="af-min" name="min_amount" class="ltr" inputmode="decimal" value="${esc(cur?.min_amount || '0')}">`, esc(t('ad.minHelp')))}</form>`,
        buttons: [{ label: t('common.cancel'), value: null }, { label: t('common.save'), value: (w) => ({ ...formData($('#af', w)), asset: asset || $('#af-asset', w).value }) }],
      });
      if (!d) return;
      try {
        const r = await api('PUT', '/api/panel/payout-addresses', d);
        toast(r.held_hours ? t('ad.savedHeld', { h: r.held_hours }) : t('common.saved'));
        VIEWS.addresses(el, ctx);
      } catch (e) { toast(errText(e), 'err'); }
    };
    $('#add-addr').onclick = () => edit();
    $$('[data-edit]', el).forEach((b) => b.addEventListener('click', () => edit(b.dataset.edit)));
    $$('[data-del]', el).forEach((b) => b.addEventListener('click', async () => {
      if (!(await confirmDialog(t('ad.delTitle'), esc(t('ad.delQ', { a: b.dataset.del })), { danger: true, ok: t('common.delete') }))) return;
      try { await api('DELETE', `/api/panel/payout-addresses/${b.dataset.del}`); toast(t('ad.deleted')); VIEWS.addresses(el, ctx); } catch (e) { toast(errText(e), 'err'); }
    }));
  },

  async developers(el, ctx) {
    ctx.setHeader(t('dev.title'), esc(t('dev.sub')));
    const k = await api('GET', '/api/panel/api-keys');
    const base = location.origin;
    el.innerHTML = `
      ${panel({ title: t('dev.keys'), desc: t('dev.keysSub'), actions: `<button class="btn sm" id="new-key">${icon('plus')}${esc(t('dev.newKey'))}</button>`, flush: true,
        body: table([t('dev.name'), t('dev.key'), t('dev.ips'), t('dev.lastUsed'), t('common.status'), ''], k.data.map((x) => [
          `<b>${esc(x.label)}</b>`, `<span class="mono small">${esc(x.key_prefix)}…</span>`,
          x.allowed_ips?.length ? `<span class="mono small">${esc(x.allowed_ips.join(', '))}</span>` : `<span class="muted small">${esc(t('dev.anyIp'))}</span>`,
          `<span class="small text-2">${fmtDate(x.last_used_at)}</span>`, x.revoked_at ? `<span class="badge b-muted">${esc(t('st.revoked'))}</span>` : `<span class="badge b-ok">${esc(t('common.active'))}</span>`,
          x.revoked_at ? '' : `<div class="row" style="flex-wrap:nowrap;justify-content:flex-end"><button class="btn sm secondary" data-ips="${esc(x.id)}">${esc(t('dev.ips'))}</button><button class="btn sm danger-soft" data-revoke="${esc(x.id)}">${esc(t('dev.revoke'))}</button></div>`,
        ]), { empty: t('dev.noKeys'), emptyIcon: 'key' }) })}
      ${panel({ title: t('dev.webhook'), desc: t('dev.webhookSub'), body: `<div class="stack">
        <form id="wh" class="form-grid" style="grid-template-columns:minmax(0,1fr) auto">${field(t('dev.webhookUrl'), `<input id="wh-url" name="webhook_url" class="ltr" placeholder="https://yoursite.com/payment/callback" value="${esc(me.merchant.webhook_url || '')}">`)}<button class="btn">${esc(t('common.save'))}</button></form>
        <div class="row"><span class="text-2">${esc(t('dev.secret'))}</span><span class="spacer"></span><button class="btn sm secondary" id="show-secret">${esc(t('dev.show'))}</button><button class="btn sm danger-soft" id="rotate-secret">${esc(t('dev.rotate'))}</button></div>
        <div id="secret"></div></div>` })}
      ${panel({ title: t('dev.guide'), body: `<div class="stack">
        <p>${t('dev.guide1')}</p>
        <h3>${esc(t('dev.createInvoice'))}</h3>
<pre>curl -X POST ${esc(base)}/v1/invoices \\
  -H "Authorization: Bearer txp_..." -H "Content-Type: application/json" \\
  -d '{"price_amount":"25","price_currency":"USD","order_id":"1001",
       "customer_id":"user-42","success_url":"https://shop.example/thanks"}'</pre>
        ${alertBox('info', t('dev.custTip'))}${alertBox('warn', t('dev.custSec'))}${alertBox('info', t('dev.langTip'), 'globe')}
        <h3>${esc(t('dev.verify'))}</h3>
<pre>// Node.js
const sig = crypto.createHmac('sha256', WEBHOOK_SECRET)
  .update(req.headers['x-webhook-timestamp'] + '.' + rawBody).digest('hex');
if (sig !== req.headers['x-webhook-signature']) return res.status(401).end();
if (event === 'invoice.paid') deliverOrder(data.order_id);</pre>
<pre>// PHP
$sig = hash_hmac('sha256', $_SERVER['HTTP_X_WEBHOOK_TIMESTAMP'] . '.' . file_get_contents('php://input'), $secret);
if (!hash_equals($sig, $_SERVER['HTTP_X_WEBHOOK_SIGNATURE'])) { http_response_code(401); exit; }</pre>
        <p class="small muted">${esc(t('dev.events'))}: <code>invoice.confirming</code> · <code>invoice.paid</code> · <code>invoice.updated</code> · <code>invoice.partially_paid</code> · <code>invoice.expired</code> · <code>invoice.cancelled</code> · <code>payout.created</code> · <code>payout.completed</code> · <code>payout.failed</code></p></div>` })}`;

    $('#new-key').onclick = async () => {
      const d = await modal({
        title: t('dev.newKey'), ico: 'key',
        body: `<form id="kf" class="stack">${field(t('dev.keyName'), `<input id="kf-label" name="label" required placeholder="${esc(t('dev.keyNamePh'))}">`)}
          ${field(`${t('dev.ips')} <span class="muted">(${esc(t('common.optional'))})</span>`, '<input id="kf-ips" name="allowed_ips" class="ltr" placeholder="203.0.113.7, 10.0.0.0/24">', esc(t('dev.ipsHelp')))}</form>`,
        buttons: [{ label: t('common.cancel'), value: null }, { label: t('dev.create'), value: (w) => formData($('#kf', w)) }],
      });
      if (!d) return;
      try {
        const r = await api('POST', '/api/panel/api-keys', { label: d.label || 'default', allowed_ips: d.allowed_ips });
        await modal({ title: t('dev.keyCreated'), ico: 'key', body: `<div class="stack">${alertBox('warn', t('dev.keyOnce'))}${copyField(r.key)}</div>`, buttons: [{ label: t('dev.savedIt'), value: true }] });
        VIEWS.developers(el, ctx);
      } catch (e) { toast(errText(e), 'err'); }
    };
    $$('[data-ips]', el).forEach((b) => b.addEventListener('click', async () => {
      const cur = k.data.find((x) => x.id === b.dataset.ips)?.allowed_ips?.join(', ') || '';
      const v = await promptDialog(t('dev.ipsTitle'), { label: t('dev.ipsLabel'), value: cur, help: esc(t('dev.ipsHelp')), ltr: true });
      if (v === null) return;
      try { await api('PATCH', `/api/panel/api-keys/${b.dataset.ips}`, { allowed_ips: v }); toast(t('common.saved')); VIEWS.developers(el, ctx); } catch (e) { toast(errText(e), 'err'); }
    }));
    $$('[data-revoke]', el).forEach((b) => b.addEventListener('click', async () => {

    }));
    $('#wh').addEventListener('submit', (e) => {
      e.preventDefault();

      if (!(await confirmDialog(t('dev.rotateTitle'), esc(t('dev.rotateQ')), { danger: true, ok: t('dev.rotate') }))) return;

  },

  async apidocs(el, ctx) {
    const L = (fa, en) => (LANG === 'fa' ? fa : en);

    const base = location.origin + '/v1';

    el.innerHTML = [
      sec(L('شروع سریع', 'Quick start'), `
        <p>${L('همه درخواست‌ها <b>سرور به سرور</b> هستند؛ کلید API را هرگز در مرورگر یا اپ موبایل نگذارید.', 'All requests are <b>server to server</b>. Never put the API key in a browser or mobile app.')}</p>
        <p>${L('آدرس پایه', 'Base URL')}: ${code(base)} · JSON · ${L('مبالغ به‌صورت رشته اعشاری', 'amounts are decimal strings')}</p>
        <ol class="small">
          <li>${L('در «API و Webhook» یک کلید API بسازید (فقط یک‌بار نمایش داده می‌شود).', 'Create an API key under “API & webhooks” (shown only once).')}</li>
          <li>${L('آدرس Webhook و آدرس تسویه هر ارز را وارد کنید.', 'Set your webhook URL and the payout address for each currency.')}</li>

        </ol>
        ${pre(`curl -X POST ${base}/invoices \\\n  -H "Authorization: Bearer txp_..." -H "Content-Type: application/json" \\\n  -d '{"price_amount":"25","price_currency":"USD","order_id":"1001"}'`)}`),

      sec(L('احراز هویت و خطاها', 'Authentication & errors'), `

          ['order_id', 'string ≤128', L('شناسه سفارش شما', 'Your order id')],
          ['customer_id', 'string ≤128', L('شناسه کاربر شما؛ از نشست سرور بفرستید نه ورودی کاربر', 'Your user id; take it from the server session, not user input')],
          ['description', 'string ≤500', L('نمایش در صفحه پرداخت', 'Shown on the payment page')],
          ['success_url / cancel_url', 'URL', L('مقصد بازگشت مشتری', 'Where the customer returns')],
          ['metadata', 'object', L('در Webhook برمی‌گردد', 'Echoed back in webhooks')],
          ['expires_in_minutes', 'integer', L('مهلت پرداخت', 'Payment deadline')],
          ['fee_paid_by', 'merchant|customer', L('کارمزد شبکه از سهم شما یا اضافه بر مبلغ مشتری', 'Network fee from your share or added to the customer’s amount')],
        ]), { empty: '' })}
        <p class="small">${L('مشتری را به <code>payment_url</code> هدایت کنید.', 'Redirect the customer to <code>payment_url</code>.')}</p>`),

      sec(L('خواندن، فهرست و لغو', 'Read, list, cancel'), `
        <ul class="small">
          <li>${code('GET /v1/invoices/:id')} — ${L('فاکتور + آرایه deposits', 'invoice + deposits array')}</li>
          <li>${code('GET /v1/invoices?status=&limit=&before=')} — ${L('limit ۱ تا ۱۰۰ (پیش‌فرض ۲۰)، before = زمان ISO. پاسخ: <code>{"data":[…]}</code>', 'limit 1–100 (default 20), before = ISO time. Response: <code>{"data":[…]}</code>')}</li>
          <li>${code('POST /v1/invoices/:id/cancel')} — ${L('فقط pending/expired بدون پرداخت', 'only pending/expired without payments')}</li>
        </ul>
        ${pre(`{\n  "id": "…", "order_id": "1001", "customer_id": null, "status": "pending",\n  "price_amount": "25", "price_currency": "USD",\n  "asset": "USDT_BEP20", "network": "bsc", "address": "0x…", "memo": null,\n  "pay_amount": "25.000000", "amount_received": "0", "amount_pending": "0", "rate": "1",\n  "fee_amount": "0", "network_fee": "0", "fee_paid_by": "merchant", "net_amount": null,\n  "is_late": false, "payment_url": "${base.replace('/v1', '')}/pay/…",\n  "metadata": {}, "expires_at": "…", "paid_at": null, "created_at": "…",\n  "deposits": [{ "tx_hash": "0x…", "from": "0x…", "amount": "25", "confirmations": 12,\n                 "status": "confirmed", "detected_at": "…" }]\n}`)}
        <p class="small muted">${L('<code>asset</code>، <code>address</code> و <code>pay_amount</code> تا انتخاب ارز توسط مشتری ممکن است null باشند. <code>memo</code> فقط برای TON است. <code>net_amount</code> فقط بعد از paid مقدار دارد.', '<code>asset</code>, <code>address</code> and <code>pay_amount</code> may be null until the customer picks a currency. <code>memo</code> is TON only. <code>net_amount</code> is set only after paid.')}</p>
        ${table([L('وضعیت فاکتور', 'Invoice status'), L('معنی', 'Meaning')], [
          ['<span class="mono small">pending</span>', esc(L('منتظر پرداخت', 'Waiting for payment'))],
          ['<span class="mono small">confirming</span>', esc(L('واریز دیده شد، منتظر تاییدیه', 'Payment seen, awaiting confirmations'))],
          ['<span class="mono small">paid</span>', esc(L('کامل و تایید شد ← سفارش را تکمیل کنید', 'Complete and confirmed → fulfil the order'))],
          ['<span class="mono small">partially_paid</span>', esc(L('کمتر از مبلغ پرداخت شده', 'Underpaid'))],
          ['<span class="mono small">expired</span> / <span class="mono small">cancelled</span>', esc(L('منقضی / لغو شده', 'Expired / cancelled'))],
        ], { empty: '' })}
        <p class="small muted">${L('وضعیت واریز (deposit): pending، confirmed، orphaned (از بین رفته). پرداخت اضافه یا دیرهنگام بعد از paid هم اعتبار می‌گیرد و با invoice.updated خبر داده می‌شود.', 'Deposit status: pending, confirmed, orphaned (dropped by the network). Extra or late payments after paid are still credited and announced with invoice.updated.')}</p>`),

      sec(L('ارزها، موجودی و تسویه', 'Currencies, balances, payouts'), `
        <ul class="small">
          <li>${code('GET /v1/currencies')} — ${L('ارزهای فعال شما؛ <code>id</code> را در <code>asset</code> بدهید (مثل TRX، USDT_BEP20، USDT_TRC20، ETH، BNB، TON…)', 'your active currencies; pass <code>id</code> as <code>asset</code> (TRX, USDT_BEP20, USDT_TRC20, ETH, BNB, TON…)')}</li>
          <li>${code('GET /v1/balances')} — <code>{"data":[{"asset":"USDT_BEP20","balance":"120.5"}]}</code></li>
          <li>${code('GET /v1/payouts')} — ${L('تاریخچه تسویه', 'payout history')}</li>
          <li>${code('POST /v1/payouts')} <code>{"asset":"USDT_BEP20"}</code> — ${L('درخواست تسویه دستی (201)', 'manual payout request (201)')}</li>
        </ul>
        <p class="small muted">${L('وضعیت تسویه: pending_approval، approved، sending، sent، completed، failed، rejected. در شکست یا رد، مبلغ به موجودی برمی‌گردد.', 'Payout status: pending_approval, approved, sending, sent, completed, failed, rejected. On failure or rejection the amount returns to your balance.')}</p>`),

      sec('Webhook', `
        ${pre('{ "id": "uuid", "event": "invoice.paid", "created_at": "…", "data": { …invoice or payout… } }')}
        ${table([L('هدر', 'Header'), L('توضیح', 'Description')], [
          ['<span class="mono small">x-webhook-id</span>', esc(L('شناسه یکتا؛ برای جلوگیری از پردازش تکراری', 'Unique id; use it to avoid duplicate processing'))],
          ['<span class="mono small">x-webhook-timestamp</span>', esc(L('ثانیه یونیکس', 'Unix seconds'))],
          ['<span class="mono small">x-webhook-signature</span>', '<span class="mono small">HMAC_SHA256(secret, timestamp + "." + rawBody)</span> (hex)'],
        ], { empty: '' })}
        <ul class="small">
          <li>${L('هر پاسخ غیر 2xx یا timeout (۱۰ ثانیه) تکرار می‌شود: تا ۱۲ بار، با فاصله ۳۰ ثانیه، ۱، ۲، ۴ دقیقه … حداکثر ۶ ساعت.', 'Any non-2xx response or timeout (10 s) is retried: up to 12 times, after 30 s, 1, 2, 4 min … max 6 h.')}</li>
          <li>${L('یک رویداد ممکن است بیش از یک‌بار برسد و ترتیب تضمین نیست؛ پردازش را idempotent بنویسید یا وضعیت را با API بخوانید.', 'An event may arrive more than once and order is not guaranteed; make handling idempotent or re-read the state via the API.')}</li>
          <li>${L('امضا را روی <b>بدنه خام</b> بررسی کنید و زمان را حداکثر ۵ دقیقه تلورانس بدهید. ریدایرکت دنبال نمی‌شود.', 'Verify the signature on the <b>raw body</b> and allow at most 5 minutes of clock skew. Redirects are not followed.')}</li>
        </ul>
        <p class="small muted">${esc(t('dev.events'))}: <code>invoice.confirming</code> · <code>invoice.paid</code> · <code>invoice.updated</code> · <code>invoice.partially_paid</code> · <code>invoice.expired</code> · <code>invoice.cancelled</code> · <code>payout.created</code> · <code>payout.completed</code> · <code>payout.failed</code> · <code>payout.rejected</code></p>
        <h3>Node.js</h3>
        ${pre(`app.post('/trafx-webhook', express.raw({ type: 'application/json' }), (req, res) => {\n  const ts = req.header('x-webhook-timestamp');\n  const sig = req.header('x-webhook-signature') || '';\n  const body = req.body.toString('utf8');\n  const expected = crypto.createHmac('sha256', SECRET).update(ts + '.' + body).digest('hex');\n  const ok = sig.length === expected.length &&\n    crypto.timingSafeEqual(Buffer.from(sig), Buffer.from(expected)) &&\n    Math.abs(Date.now() / 1000 - Number(ts)) < 300;\n  if (!ok) return res.sendStatus(400);\n  const evt = JSON.parse(body);\n  if (evt.event === 'invoice.paid') { /* fulfil evt.data.order_id once */ }\n  res.sendStatus(200);\n});`)}
        <h3>PHP</h3>
        ${pre(`$body = file_get_contents('php://input');\n$ts  = $_SERVER['HTTP_X_WEBHOOK_TIMESTAMP'] ?? '';\n$sig = $_SERVER['HTTP_X_WEBHOOK_SIGNATURE'] ?? '';\n$expected = hash_hmac('sha256', $ts . '.' . $body, $secret);\nif (!hash_equals($expected, $sig) || abs(time() - (int)$ts) > 300) { http_response_code(400); exit; }\n$evt = json_decode($body, true);\nif ($evt['event'] === 'invoice.paid') { /* fulfil $evt['data']['order_id'] once */ }\nhttp_response_code(200);`)}`),

      sec(L('نکات مهم', 'Integration tips'), `<ul class="small">
        <li>${L('سفارش را فقط با Webhook <code>invoice.paid</code> (یا خواندن وضعیت از API) تکمیل کنید، نه با بازگشت مشتری به success_url.', 'Fulfil orders only on the <code>invoice.paid</code> webhook (or by reading the status via the API), never on the customer returning to success_url.')}</li>
        <li>${L('نرخ هنگام صدور فاکتور قفل می‌شود؛ <code>pay_amount</code> را همان‌طور که هست نمایش دهید.', 'The rate is locked when the invoice is created; show <code>pay_amount</code> as is.')}</li>
        <li>${L('مبلغ را با ارز پشتیبانی‌شده (مثلاً USDT یا USD) بفرستید؛ تبدیل تومان با شماست و نرخ را هنگام ساخت فاکتور در سفارش ذخیره کنید.', 'Send the amount in a supported currency (e.g. USDT or USD). Converting from Toman is up to you; store the rate on your order when you create the invoice.')}</li>
        <li>${L('پیش از راه‌اندازی واقعی، چرخه کامل را با مبلغ کم تست کنید.', 'Test the full cycle with a small amount before going live.')}</li></ul>`),
    ].join('');
  },

  async settings(el, ctx) {
    ctx.setHeader(t('set.title'));
    me = await api('GET', '/api/panel/me');
    const m = me.merchant;
    const wd = t('wd');
    el.innerHTML = `
      ${panel({ title: t('set.business'), body: `<form id="sf" class="stack">
        <div class="grid grid-2">
          ${field(t('set.name'), `<input id="sf-name" name="name" value="${esc(m.name)}">`)}
          ${field(t('set.feePayer'), `<select id="sf-payer" name="fee_payer"><option value="merchant" ${m.fee_payer === 'merchant' ? 'selected' : ''}>${esc(t('set.payerMerchant'))}</option><option value="customer" ${m.fee_payer === 'customer' ? 'selected' : ''}>${esc(t('set.payerCustomer'))}</option></select>`, esc(t('set.payerHelp')))}
          ${field(t('set.schedule'), `<select id="sf-sch" name="settlement_schedule">${['daily', 'weekly', 'manual'].map((k) => `<option value="${k}" ${k === m.settlement_schedule ? 'selected' : ''}>${esc(t('sch.' + k))}</option>`).join('')}</select>`, esc(t('set.scheduleHelp')))}
          ${field(t('set.weekday'), `<select id="sf-wd" name="settlement_weekday">${wd.map((d, i) => `<option value="${i}" ${i === m.settlement_weekday ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select>`)}
        </div>
        <div><button class="btn">${esc(t('set.saveChanges'))}</button></div></form>` })}
      ${panel({ title: t('set.currencies'), body: `<div class="row">${me.assets.map((a) => `<span class="badge b-info">${esc(a.symbol)} · ${esc(a.network_name)}</span>`).join('')}</div>` })}`;
    $('#sf').addEventListener('submit', (e) => {
      e.preventDefault();
      const d = formData(e.target);
      busy(e.submitter, async () => { await api('PATCH', '/api/panel/settings', { ...d, settlement_weekday: Number(d.settlement_weekday) }); me = await api('GET', '/api/panel/me'); toast(t('common.saved')); });
    });
  },

  async security(el, ctx) {
    ctx.setHeader(t('sec.title'));
    el.innerHTML = `<div class="grid grid-2">
      ${panel({ title: t('tfa.title'), body: '<div id="tfa"></div>' })}
      ${panel({ title: t('sec.pw'), body: `<form id="pw" class="stack">${field(t('sec.pwCur'), '<input id="pw-cur" type="password" name="current" class="ltr" required autocomplete="current-password">')}${field(t('sec.pwNew'), '<input id="pw-new" type="password" name="next" class="ltr" minlength="10" required autocomplete="new-password">', esc(t('sec.pwHelp')))}<div><button class="btn">${esc(t('sec.pwBtn'))}</button></div></form>` })}
    </div>${panel({ title: t('au.title'), desc: t('sec.activity'), flush: true, body: '<div id="audit"></div>' })}`;
    await twoFactorSection($('#tfa'), '/api/panel', () => VIEWS.security(el, ctx));
    $('#audit').innerHTML = auditTable((await api('GET', '/api/panel/audit')).data);
    $('#pw').addEventListener('submit', (e) => {
      e.preventDefault();
      busy(e.submitter, async () => { await api('POST', '/api/panel/password', formData(e.target)); toast(t('sec.pwDone')); setTimeout(() => location.reload(), 1200); });
    });
  },
};

start();
</script>
