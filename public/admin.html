<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت — TrafxPayment</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<script src="/assets/app.js"></script>
<script>
'use strict';
let admin, shell;

async function start() {
  try { admin = await api('GET', '/api/admin/me'); }
  catch {
    await loginScreen({
      title: 'ورود مدیر', role: 'admin',
      subtitle: 'مدیریت درگاه، پذیرندگان و تسویه‌ها',
      features: ['تایید و رد تسویه‌ها', 'تنظیم کارمزد هر پذیرنده', 'کنترل کیف داغ و سرد', 'گزارش کامل وقایع'],
    });
    admin = await api('GET', '/api/admin/me');
  }
  shell = createShell({
    product: 'TrafxPayment', subtitle: 'پنل مدیریت',
    user: { name: admin.email, role: 'مدیر' },
    onLogout: async () => { await api('POST', '/api/auth/logout'); location.reload(); },
    nav: [
      { id: 'overview', label: 'نمای کلی', icon: 'dashboard' },
      { id: 'merchants', label: 'پذیرندگان', icon: 'users' },
      { id: 'payouts', label: 'تسویه‌ها', icon: 'payout' },
      { id: 'invoices', label: 'فاکتورها', icon: 'invoice' },
      { id: 'unmatched', label: 'واریزهای نامشخص', icon: 'alert' },
      { section: 'سیستم' },
      { id: 'assets', label: 'تنظیمات ارزها', icon: 'coins' },
      { id: 'webhooks', label: 'وبهوک‌های ناموفق', icon: 'bolt' },
      { id: 'audit', label: 'گزارش وقایع', icon: 'list' },
      { id: 'account', label: 'امنیت حساب', icon: 'shield' },
    ],
    views: VIEWS,
  });
  refreshCounts();
}

async function refreshCounts() {
  try {
    const s = await api('GET', '/api/admin/summary');
    shell.setCount('payouts', s.payouts_pending_approval);
    shell.setCount('unmatched', s.unmatched_deposits);
  } catch { /* ignore */ }
}

const VIEWS = {
  async overview(el, ctx) {
    const s = await api('GET', '/api/admin/summary');
    const c = s.invoices_30d;
    const stable = (k) => s.assets.filter((a) => a.asset.startsWith('USDT')).reduce((t, a) => t + Number(a[k] || 0), 0);
    ctx.setHeader('نمای کلی', '۳۰ روز اخیر و وضعیت کل حساب‌ها');
    el.innerHTML = `
      ${admin.totp_enabled ? '' : alertBox('warn', 'تایید دومرحله‌ای حساب مدیر <b>فعال نیست</b>. هر کسی رمز شما را داشته باشد می‌تواند تسویه تایید کند. <a href="#account">فعال‌سازی</a>') + '<div style="height:16px"></div>'}
      <div class="grid grid-4" style="margin-bottom:18px">
        ${kpi({ label: 'درآمد کارمزد (USDT)', value: fmtAmount(stable('platform_fees').toFixed(2), 2), ico: 'coins', tone: 'ok', hint: `+ ${fmtAmount(stable('network_fees').toFixed(2), 2)} کارمزد شبکه` })}
        ${kpi({ label: 'حجم دریافتی (USDT)', value: fmtAmount(stable('volume').toFixed(2), 2), ico: 'trend' })}
        ${kpi({ label: 'تسویه منتظر تایید', value: s.payouts_pending_approval, ico: 'clock', tone: s.payouts_pending_approval ? 'warn' : '', hint: '<a href="#payouts">بررسی</a>' })}
        ${kpi({ label: 'واریز نامشخص', value: s.unmatched_deposits, ico: 'alert', tone: s.unmatched_deposits ? 'err' : '', hint: '<a href="#unmatched">بررسی</a>' })}
      </div>
      <div class="grid grid-4" style="margin-bottom:18px">
        ${kpi({ label: 'پرداخت‌شده', value: c.paid || 0, ico: 'checkCircle', tone: 'ok', hint: '۳۰ روز' })}
        ${kpi({ label: 'در انتظار / تایید', value: (c.pending || 0) + (c.confirming || 0), ico: 'clock', hint: '۳۰ روز' })}
        ${kpi({ label: 'ناقص', value: c.partially_paid || 0, ico: 'alert', tone: 'warn', hint: '۳۰ روز' })}
        ${kpi({ label: 'منقضی / لغو', value: (c.expired || 0) + (c.cancelled || 0), ico: 'x', hint: '۳۰ روز' })}
      </div>
      ${card({ title: 'وضعیت ارزها', desc: '«بدهی به پذیرندگان» حداقل مبلغی است که باید در کیف داغ + آدرس‌های واریز باشد', flush: true,
        body: table(['ارز', 'حجم کل دریافتی', 'کارمزد درگاه', 'کارمزد شبکه واریز', 'کارمزد شبکه تسویه', 'بدهی به پذیرندگان'], s.assets.map((a) => [assetLabel(a.asset), num(fmtAmount(a.volume)), `<b class="num" style="color:var(--ok)">${fmtAmount(a.platform_fees)}</b>`, num(fmtAmount(a.network_fees)), num(fmtAmount(a.payout_fees)), `<b class="num">${fmtAmount(a.merchant_balances)}</b>`]), { empty: 'هنوز تراکنشی نیست' }) })}
      ${card({ title: 'شبکه‌های فعال', body: `<div class="row">${s.available_assets.map((a) => `<span class="badge b-info">${esc(a.symbol)} · ${esc(a.network_name)}</span>`).join('') || '<span class="muted">هیچ</span>'}</div>` })}`;
    refreshCounts();
  },

  async merchants(el, ctx) {
    ctx.setHeader('پذیرندگان', '', `<button class="btn" id="new-m">${icon('plus')}پذیرنده جدید</button>`);
    const r = await api('GET', '/api/admin/merchants');
    el.innerHTML = card({ flush: true, body: table(['پذیرنده', 'کارمزد', 'پرداخت کارمزد شبکه', 'تسویه', '2FA', 'وضعیت', ''], r.data.map((m) => [
      `<b>${esc(m.name)}</b><div class="small muted mono">${esc(m.email)}</div>`,
      `<b class="num">${esc(String(m.fee_percent).replace(/\.?0+$/, ''))}٪</b>`,
      m.fee_payer === 'customer' ? 'مشتری' : 'پذیرنده',
      SCHEDULE[m.settlement_schedule] + (m.settlement_schedule === 'weekly' ? ` · ${WEEKDAYS[m.settlement_weekday]}` : ''),
      m.totp_enabled ? '<span class="badge b-ok">فعال</span>' : '<span class="badge b-muted">خاموش</span>',
      m.is_active ? '<span class="badge b-ok">فعال</span>' : '<span class="badge b-err">مسدود</span>',
      `<button class="btn sm secondary" data-m="${esc(m.id)}">مدیریت</button>`,
    ]), { empty: 'هنوز پذیرنده‌ای ندارید', emptyIcon: 'users' }) });
    $('#new-m').onclick = async () => {
      const d = await modal({
        title: 'پذیرنده جدید', ico: 'users',
        body: `<form id="mf" class="stack">${field('نام کسب‌وکار', '<input name="name" required>')}${field('ایمیل ورود', '<input name="email" type="email" class="ltr" required>')}
          <div class="grid grid-2">${field('رمز اولیه', '<input name="password" class="ltr" minlength="10" required>', 'حداقل ۱۰ کاراکتر')}${field('کارمزد ٪', '<input name="fee_percent" class="ltr" value="1">')}</div></form>`,
        buttons: [{ label: 'انصراف', value: null }, { label: 'ساخت', value: (w) => formData($('#mf', w)) }],
      });
      if (!d) return;
      try {
        const res = await api('POST', '/api/admin/merchants', { ...d, fee_percent: Number(d.fee_percent) });
        await modal({ title: 'پذیرنده ساخته شد', ico: 'checkCircle', body: `<p>این اطلاعات را به پذیرنده بدهید:</p>
          <div class="stack small"><div>پنل: ${copyField(location.origin + '/panel')}</div><div>ایمیل: ${copyField(d.email)}</div><div>کلید API (فقط یک بار نمایش داده می‌شود): ${copyField(res.api_key)}</div></div>`, buttons: [{ label: 'بستن', value: null }] });
        VIEWS.merchants(el, ctx);
      } catch (e) { toast(e.message, 'err'); }
    };
    $$('[data-m]', el).forEach((b) => b.addEventListener('click', () => merchantDetail(b.dataset.m, () => VIEWS.merchants(el, ctx))));
  },

  async payouts(el, ctx, status = 'pending_approval') {
    ctx?.setHeader('تسویه‌ها', 'تایید شما = ارسال خودکار از کیف داغ', `<button class="btn secondary" id="run-s">${icon('refresh')}اجرای تسویه‌های سررسید</button>`);
    if (ctx) $('#run-s').onclick = (e) => busy(e.currentTarget, async () => { const x = await api('POST', '/api/admin/settlements/run'); toast(`${x.data.length} تسویه ساخته شد`); VIEWS.payouts(el, null, status); });
    const r = await api('GET', `/api/admin/payouts${status ? '?status=' + status : ''}`);
    const tabs = [['pending_approval', 'منتظر تایید'], ['approved', 'تایید شده'], ['sending', 'در حال ارسال'], ['sent', 'ارسال شده'], ['completed', 'تکمیل'], ['failed', 'ناموفق'], ['', 'همه']];
    el.innerHTML = card({ flush: true, body: `<div class="tabs" style="padding:0 12px;margin:0">${tabs.map(([k, t]) => `<button data-st="${k}" class="${k === status ? 'active' : ''}">${t}</button>`).join('')}</div>
      ${table(['پذیرنده', 'ارز', 'مبلغ', 'کارمزد شبکه', 'مقصد', 'وضعیت', 'تراکنش / خطا', ''], r.data.map((p) => [
        `<b>${esc(p.merchant_name)}</b><div class="small muted">${fmtDate(p.created_at)}</div>`, assetLabel(p.asset), `<b class="num">${fmtAmount(p.amount)}</b>`, num(fmtAmount(p.fee)),
        `<span class="mono small" title="${esc(p.address)}">${esc(short(p.address, 8))}</span> <button class="btn sm ghost icon" data-copy="${esc(p.address)}">${icon('copy')}</button>`,
        badge(p.status),
        `${p.tx_hash ? `<span class="mono small">${esc(short(p.tx_hash, 8))}</span>` : ''}${p.error ? `<div class="small" style="color:var(--err);white-space:normal;max-width:260px">${esc(p.error)}</div>` : ''}`,
        `<div class="row" style="flex-wrap:nowrap">${p.status === 'pending_approval' ? `<button class="btn sm success" data-approve="${esc(p.id)}">تایید</button>` : ''}${['pending_approval', 'approved', 'sending'].includes(p.status) ? `<button class="btn sm danger soft" data-reject="${esc(p.id)}">رد</button>` : ''}</div>`,
      ]), { empty: 'تسویه‌ای در این وضعیت نیست', emptyIcon: 'payout' })}` });
    $$('[data-st]', el).forEach((b) => b.addEventListener('click', () => VIEWS.payouts(el, null, b.dataset.st)));
    $$('[data-approve]', el).forEach((b) => b.addEventListener('click', async () => {
      const p = r.data.find((x) => x.id === b.dataset.approve);
      if (!(await confirmDialog('تایید تسویه', `${fmtAmount(p.amount)} ${esc(p.asset)} به <span class="mono">${esc(p.address)}</span> ارسال شود؟ این کار برگشت‌پذیر نیست.`, { ok: 'تایید و ارسال' }))) return;
      await busy(b, async () => { await api('POST', `/api/admin/payouts/${p.id}/approve`); toast('تایید شد؛ تا چند ثانیه ارسال می‌شود'); VIEWS.payouts(el, null, status); refreshCounts(); });
    }));
    $$('[data-reject]', el).forEach((b) => b.addEventListener('click', async () => {
      const reason = await promptDialog('رد تسویه', { label: 'دلیل', value: 'rejected by admin', help: 'مبلغ به موجودی پذیرنده برمی‌گردد. برای «در حال ارسال» اول در اکسپلورر مطمئن شوید تراکنش ثبت نشده.' });
      if (reason === null) return;
      await busy(b, async () => { await api('POST', `/api/admin/payouts/${b.dataset.reject}/reject`, { reason: reason || 'rejected by admin' }); toast('رد شد'); VIEWS.payouts(el, null, status); refreshCounts(); });
    }));
  },

  async invoices(el, ctx, status = '') {
    ctx?.setHeader('فاکتورها');
    const r = await api('GET', `/api/admin/invoices?limit=100${status ? '&status=' + status : ''}`);
    const tabs = [['', 'همه'], ['paid', 'پرداخت شده'], ['pending', 'در انتظار'], ['confirming', 'در حال تایید'], ['partially_paid', 'ناقص'], ['expired', 'منقضی']];
    el.innerHTML = card({ flush: true, body: `<div class="tabs" style="padding:0 12px;margin:0">${tabs.map(([k, t]) => `<button data-st="${k}" class="${k === status ? 'active' : ''}">${t}</button>`).join('')}</div>
      ${table(['مبلغ', 'ارز', 'لازم', 'دریافتی', 'کارمزد', 'وضعیت', 'تاریخ', ''], r.data.map((i) => [
        `<b>${fmtAmount(i.price_amount, 2)} ${esc(i.price_currency)}</b>`, i.asset ? assetLabel(i.asset) : '—', num(fmtAmount(i.pay_amount)), num(fmtAmount(i.amount_received)), num(fmtAmount(i.fee_amount)),
        badge(i.status) + (i.is_late ? ' <span class="badge plain b-warn">دیرهنگام</span>' : ''), `<span class="small">${fmtDate(i.created_at)}</span>`,
        `<div class="row" style="flex-wrap:nowrap"><a class="btn sm ghost icon" href="${esc(i.payment_url)}" target="_blank">${icon('external')}</a>${['partially_paid', 'expired'].includes(i.status) && Number(i.amount_received) > 0 ? `<button class="btn sm secondary" data-paid="${esc(i.id)}">قبول</button>` : ''}</div>`,
      ]), { empty: 'فاکتوری نیست' })}` });
    $$('[data-st]', el).forEach((b) => b.addEventListener('click', () => VIEWS.invoices(el, null, b.dataset.st)));
    $$('[data-paid]', el).forEach((b) => b.addEventListener('click', async () => {
      if (!(await confirmDialog('قبول به‌عنوان پرداخت', 'مبلغ دریافتی (کمتر از فاکتور) به‌عنوان پرداخت کامل پذیرفته و به حساب پذیرنده واریز شود؟'))) return;
      await busy(b, async () => { await api('POST', `/api/admin/invoices/${b.dataset.paid}/mark-paid`); toast('ثبت شد'); VIEWS.invoices(el, null, status); });
    }));
  },

  async unmatched(el, ctx) {
    ctx.setHeader('واریزهای نامشخص', 'واریزهایی که به فاکتوری وصل نشدند');
    const r = await api('GET', '/api/admin/deposits/unmatched');
    el.innerHTML = `${alertBox('info', 'دلایل رایج: ارز یا شبکه اشتباه، یا ننوشتن کامنت (Memo) در TON. پس از بررسی، از «پذیرندگان ← مدیریت ← اصلاحیه موجودی» رسیدگی کنید.')}<div style="height:14px"></div>
      ${card({ flush: true, body: table(['زمان', 'شبکه', 'ارز', 'مبلغ', 'از', 'به', 'Memo', 'تراکنش'], r.data.map((d) => [
        fmtDate(d.detected_at), esc(NETWORK[d.chain] || d.chain), assetLabel(d.asset), `<b class="num">${fmtAmount(d.amount)}</b>`,
        `<span class="mono small">${esc(short(d.from_address))}</span>`, `<span class="mono small">${esc(short(d.to_address))}</span>`, `<span class="mono small">${esc(d.memo || '—')}</span>`,
        `<span class="mono small">${esc(short(d.tx_hash, 8))}</span> <button class="btn sm ghost icon" data-copy="${esc(d.tx_hash)}">${icon('copy')}</button>`,
      ]), { empty: 'واریز نامشخصی نیست', emptyIcon: 'checkCircle' }) })}`;
  },

  async assets(el, ctx) {
    ctx.setHeader('تنظیمات ارزها', 'هزینه، حداقل‌ها و کیف داغ برای هر ارز');
    const r = await api('GET', '/api/admin/asset-settings');
    const F = [
      ['min_amount', 'حداقل مبلغ فاکتور', 'فاکتورهای کوچک‌تر این شبکه را نمی‌بینند'],
      ['deposit_fee', 'کارمزد شبکه واریز', 'برای هر پرداخت؛ از مشتری یا پذیرنده'],
      ['sweep_threshold', 'حد sweep', 'جمع‌آوری یک‌جای پول آدرس‌ها'],
      ['payout_fee', 'کارمزد شبکه تسویه', 'از هر تسویه پذیرنده'],
      ['hot_max', 'سقف کیف داغ', 'مازاد به کیف سرد می‌رود'],
    ];
    el.innerHTML = `<div class="grid grid-2">${r.data.map((a) => card({
      title: assetLabel(a.asset), actions: `<button class="btn sm" data-save="${esc(a.asset)}">ذخیره</button>`,
      body: `<div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${F.map(([k, t, h]) => field(t, `<input class="ltr" data-a="${esc(a.asset)}" data-k="${k}" value="${esc(a[k])}">`, h)).join('')}</div>`,
    })).join('')}</div>`;
    $$('[data-save]', el).forEach((b) => b.addEventListener('click', () => busy(b, async () => {
      const body = { asset: b.dataset.save };
      $$(`[data-a="${b.dataset.save}"]`, el).forEach((i) => (body[i.dataset.k] = i.value.trim()));
      await api('PUT', '/api/admin/asset-settings', body);
      toast(`${b.dataset.save} ذخیره شد`);
    })));
  },

  async webhooks(el, ctx) {
    ctx.setHeader('وبهوک‌های ناموفق', 'رویدادهایی که به سایت پذیرنده نرسیدند');
    const r = await api('GET', '/api/admin/webhooks/failed');
    el.innerHTML = card({ flush: true, body: table(['زمان', 'رویداد', 'تلاش', 'آخرین خطا', ''], r.data.map((w) => [
      fmtDate(w.created_at), `<span class="mono small">${esc(w.event)}</span>`, num(w.attempts), `<span class="small" style="color:var(--err)">${esc(w.last_error || '')}</span>`,
      `<button class="btn sm secondary" data-retry="${esc(w.id)}">${icon('refresh')}ارسال مجدد</button>`,
    ]), { empty: 'همه وبهوک‌ها تحویل شده‌اند', emptyIcon: 'checkCircle' }) });
    $$('[data-retry]', el).forEach((b) => b.addEventListener('click', () => busy(b, async () => { await api('POST', `/api/admin/webhooks/${b.dataset.retry}/retry`); toast('در صف ارسال'); VIEWS.webhooks(el, ctx); })));
  },

  async audit(el, ctx) {
    ctx.setHeader('گزارش وقایع', 'ورودها، تغییرات امنیتی و همه کارهای مدیر');
    el.innerHTML = card({ flush: true, body: auditTable((await api('GET', '/api/admin/audit')).data) });
  },

  async account(el, ctx) {
    ctx.setHeader('امنیت حساب مدیر');
    el.innerHTML = card({ title: 'تایید دومرحله‌ای (2FA)', desc: 'وقتی فعال است، هر تغییر در پنل مدیر (تایید تسویه، کارمزد، …) کد می‌خواهد', body: '<div id="tfa"></div>' });
    await twoFactorSection($('#tfa'), '/api/admin', async () => { admin = await api('GET', '/api/admin/me'); VIEWS.account(el, ctx); });
  },
};

async function merchantDetail(id, onChange) {
  const d = await api('GET', `/api/admin/merchants/${id}`);
  const m = d.merchant;
  const result = await modal({
    title: m.name, ico: 'users',
    body: `<div style="max-height:65vh;overflow:auto" class="stack">
      <form id="em" class="grid grid-2">
        ${field('کارمزد ٪', `<input name="fee_percent" class="ltr" value="${esc(String(m.fee_percent).replace(/\.?0+$/, ''))}">`)}
        ${field('وضعیت', `<select name="is_active"><option value="true" ${m.is_active ? 'selected' : ''}>فعال</option><option value="false" ${m.is_active ? '' : 'selected'}>مسدود</option></select>`)}
        ${field('زمان‌بندی تسویه', `<select name="settlement_schedule">${Object.entries(SCHEDULE).map(([k, v]) => `<option value="${k}" ${k === m.settlement_schedule ? 'selected' : ''}>${v}</option>`).join('')}</select>`)}
        ${field('روز هفتگی', `<select name="settlement_weekday">${WEEKDAYS.map((x, i) => `<option value="${i}" ${i === m.settlement_weekday ? 'selected' : ''}>${x}</option>`).join('')}</select>`)}
      </form>
      <h3>موجودی</h3>${table(['ارز', 'موجودی'], d.balances.map((b) => [assetLabel(b.asset), `<b class="num">${fmtAmount(b.balance)}</b>`]), { empty: 'موجودی ندارد' })}
      <h3>آدرس‌های تسویه</h3>${table(['ارز', 'آدرس'], d.payout_addresses.map((a) => [assetLabel(a.asset), `<span class="mono small">${esc(a.address)}</span>${a.locked_until && new Date(a.locked_until) > new Date() ? ' <span class="badge b-warn">در دوره انتظار</span>' : ''}`]), { empty: 'آدرسی ثبت نشده' })}
      <div class="row"><button type="button" class="btn sm secondary" data-act="settle">${icon('payout')}تسویه فوری</button><button type="button" class="btn sm secondary" data-act="adjust">اصلاحیه موجودی</button>${m.totp_enabled ? '<button type="button" class="btn sm danger soft" data-act="reset2fa">ریست 2FA</button>' : ''}</div>
    </div>`,
    buttons: [{ label: 'بستن', value: null }, { label: 'ذخیره تغییرات', value: (w) => formData($('#em', w)) }],
    onOpen: (w) => w.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'settle' && await confirmDialog('تسویه فوری', 'برای همه ارزهای دارای آدرس، تسویه (بدون توجه به حداقل) ساخته شود؟')) {
        busy(b, async () => { const r = await api('POST', `/api/admin/merchants/${id}/settle`); toast(`${r.data.length} تسویه ساخته شد`); refreshCounts(); });
      }
      if (b.dataset.act === 'reset2fa' && await confirmDialog('ریست 2FA', 'تایید دومرحله‌ای این پذیرنده غیرفعال شود؟ (فقط پس از احراز هویت پذیرنده)', { danger: true })) {
        busy(b, async () => { await api('POST', `/api/admin/merchants/${id}/reset-2fa`); toast('ریست شد'); });
      }
      if (b.dataset.act === 'adjust') {
        const assets = [...new Set([...d.balances.map((x) => x.asset), 'USDT_TRC20', 'USDT_BEP20', 'USDT_TON'])];
        const a = await modal({
          title: 'اصلاحیه موجودی', ico: 'coins',
          body: `<form id="adj" class="stack">${field('ارز', `<select name="asset">${assets.map((x) => `<option>${esc(x)}</option>`).join('')}</select>`)}
            ${field('مبلغ', '<input name="amount" class="ltr" placeholder="10 یا -10">', 'مثبت = افزایش، منفی = کاهش')}${field('دلیل', '<input name="note" required>')}</form>`,
          buttons: [{ label: 'انصراف', value: null }, { label: 'ثبت', value: (w2) => formData($('#adj', w2)) }],
        });
        if (a) try { await api('POST', `/api/admin/merchants/${id}/adjust`, a); toast('ثبت شد'); } catch (err) { toast(err.message, 'err'); }
      }
    }),
  });
  if (!result) return onChange?.();
  try {
    await api('PATCH', `/api/admin/merchants/${id}`, { fee_percent: Number(result.fee_percent), is_active: result.is_active === 'true', settlement_schedule: result.settlement_schedule, settlement_weekday: Number(result.settlement_weekday) });
    toast('ذخیره شد');
  } catch (e) { toast(e.message, 'err'); }
  onChange?.();
}

start();
</script>
</body>
</html>
