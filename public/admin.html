<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafxPayment</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script>
'use strict';
let admin, shell, platformAssets = [];

async function start() {
  try { admin = await api('GET', '/api/admin/me'); }
  catch {
    await loginScreen({ title: t('auth.adminTitle'), pitch: t('auth.adminPitch'), role: 'admin' });
    admin = await api('GET', '/api/admin/me');
  }
  shell = createShell({
    subtitle: t('a.panel'),
    user: { name: admin.email, role: t('a.role') },
    onLogout: async () => { await api('POST', '/api/auth/logout'); location.reload(); },
    nav: [
      { id: 'overview', label: t('a.nav.overview'), icon: 'dashboard' },
      { id: 'merchants', label: t('a.nav.merchants'), icon: 'users' },
      { id: 'payouts', label: t('a.nav.payouts'), icon: 'payout' },
      { id: 'invoices', label: t('a.nav.invoices'), icon: 'invoice' },
      { id: 'unmatched', label: t('a.nav.unmatched'), icon: 'alert' },
      { section: t('a.nav.system') },
      { id: 'assets', label: t('a.nav.assets'), icon: 'coins' },
      { id: 'webhooks', label: t('a.nav.webhooks'), icon: 'bolt' },
      { id: 'audit', label: t('a.nav.audit'), icon: 'list' },
      { id: 'account', label: t('a.nav.account'), icon: 'shield' },
    ],
    views: VIEWS,
  });
  refreshCounts();
}

async function refreshCounts() {
  try {
    const s = await api('GET', '/api/admin/summary');
    platformAssets = s.available_assets;
    shell.setCount('payouts', s.payouts_pending_approval);
    shell.setCount('unmatched', s.unmatched_deposits);
  } catch { /* counters are best-effort */ }
}

const VIEWS = {
  async overview(el, ctx) {
    ctx.setHeader(t('a.nav.overview'), esc(t('a.ov.sub')));
    const [s, st] = await Promise.all([api('GET', '/api/admin/summary'), api('GET', '/api/admin/stats?days=14')]);
    platformAssets = s.available_assets;
    const c = s.invoices_30d;
    const stable = (k) => s.assets.filter((a) => a.asset.startsWith('USDT')).reduce((sum, a) => sum + Number(a[k] || 0), 0);
    el.innerHTML = `
      ${admin.totp_enabled ? '' : alertBox('warn', `${t('a.ov.no2fa')} <a href="#account">${esc(t('tfa.enable'))}</a>`, 'shield')}
      ${stats([
        { label: t('a.ov.revenue'), value: esc(fmtAmount(stable('platform_fees').toFixed(2), 2)), ico: 'coins', hint: esc(t('a.ov.plusNet', { v: fmtAmount(stable('network_fees').toFixed(2), 2) })) },
        { label: t('a.ov.volume'), value: esc(fmtAmount(stable('volume').toFixed(2), 2)), ico: 'trend' },
        { label: t('a.ov.pending'), value: s.payouts_pending_approval, ico: 'clock', tone: s.payouts_pending_approval ? 'tone-warn' : '', hint: s.payouts_pending_approval ? `<a href="#payouts">${esc(t('a.ov.review'))}</a>` : '' },
        { label: t('a.ov.unmatched'), value: s.unmatched_deposits, ico: 'alert', tone: s.unmatched_deposits ? 'tone-err' : '', hint: s.unmatched_deposits ? `<a href="#unmatched">${esc(t('a.ov.review'))}</a>` : '' },
      ])}
      <div class="grid grid-main">
        ${volumePanel(st.data)}
        ${panel({ title: t('common.days30'), flush: true, body: table([t('common.status'), ''], [
          [badge('paid'), `<b class="num">${c.paid || 0}</b>`], [badge('pending'), `<b class="num">${(c.pending || 0) + (c.confirming || 0)}</b>`],
          [badge('partially_paid'), `<b class="num">${c.partially_paid || 0}</b>`], [badge('expired'), `<b class="num">${(c.expired || 0) + (c.cancelled || 0)}</b>`],
        ], { end: [1] }) })}
      </div>
      ${panel({ title: t('a.ov.assets'), desc: t('a.ov.assetsSub'), flush: true,
        body: table([t('common.asset'), t('a.ov.totalVolume'), t('a.ov.gwFees'), t('a.ov.depFees'), t('a.ov.poFees'), t('a.ov.liab')], s.assets.map((a) => [
          assetLabel(a.asset), num(a.volume), `<b class="num" style="color:var(--ok)">${esc(fmtAmount(a.platform_fees))}</b>`, num(a.network_fees), num(a.payout_fees), `<b>${num(a.merchant_balances)}</b>`]), { end: [1, 2, 3, 4, 5] }) })}
      ${panel({ title: t('a.ov.networks'), body: `<div class="row">${s.available_assets.map((a) => `<span class="badge b-info">${esc(a.symbol)} · ${esc(a.network_name)}</span>`).join('') || esc(t('common.none'))}</div>` })}`;
    refreshCounts();
  },

  async merchants(el, ctx) {
    ctx.setHeader(t('a.m.title'), '', `<button class="btn" id="new-m">${icon('plus')}<span class="btn-text">${esc(t('a.m.new'))}</span></button>`);
    const r = await api('GET', '/api/admin/merchants');
    if (!platformAssets.length) await refreshCounts();
    el.innerHTML = panel({ flush: true, body: table([t('a.m.merchant'), t('a.m.fee'), t('a.m.feePayer'), t('a.m.settle'), t('a.m.currencies'), '2FA', t('common.status'), ''], r.data.map((m) => [
      `<b>${esc(m.name)}</b><span class="sub mono">${esc(m.email)}</span>`, `<b>${pct(m.fee_percent)}</b>`,
      esc(m.fee_payer === 'customer' ? t('a.m.customer') : t('a.m.self')),
      esc(t('sch.' + m.settlement_schedule)) + (m.settlement_schedule === 'weekly' ? ` · ${esc(t('wd')[m.settlement_weekday])}` : ''),
      m.allowed_assets ? `<span class="badge plain b-warn">${m.allowed_assets.length}</span>` : `<span class="badge plain b-muted">${esc(t('a.m.allCurrencies'))}</span>`,
      m.totp_enabled ? `<span class="badge b-ok">${esc(t('common.active'))}</span>` : `<span class="badge b-muted">${esc(t('common.disabled'))}</span>`,
      m.is_active ? `<span class="badge b-ok">${esc(t('common.active'))}</span>` : `<span class="badge b-err">${esc(t('st.blocked'))}</span>`,
      `<button class="btn sm secondary" data-m="${esc(m.id)}">${esc(t('a.m.manage'))}</button>`,
    ]), { empty: t('a.m.empty'), emptyIcon: 'users' }) });
    $('#new-m').onclick = async () => {
      const d = await modal({
        title: t('a.m.new'), ico: 'users',
        body: `<form id="mf" class="stack">${field(t('a.m.bizName'), '<input id="mf-name" name="name" required>')}${field(t('a.m.loginEmail'), '<input id="mf-email" name="email" type="email" class="ltr" required>')}
          <div class="grid grid-2">${field(t('a.m.initPw'), '<input id="mf-pw" name="password" class="ltr" minlength="10" required>', esc(t('sec.pwHelp')))}${field(t('a.m.feePct'), '<input id="mf-fee" name="fee_percent" class="ltr" inputmode="decimal" value="1">')}</div></form>`,
        buttons: [{ label: t('common.cancel'), value: null }, { label: t('a.m.create'), value: (w) => formData($('#mf', w)) }],
      });
      if (!d) return;
      try {
        const res = await api('POST', '/api/admin/merchants', { ...d, fee_percent: Number(d.fee_percent) });
        await modal({ title: t('a.m.created'), ico: 'checkCircle', body: `<div class="stack"><p>${esc(t('a.m.giveInfo'))}</p>
          ${field(t('a.m.panelUrl'), copyField(location.origin + '/panel'))}${field(t('auth.email'), copyField(d.email))}${field(t('a.m.apiOnce'), copyField(res.api_key))}</div>`, buttons: [{ label: t('common.close'), value: null }] });
        VIEWS.merchants(el, ctx);
      } catch (e) { toast(errText(e), 'err'); }
    };
    $$('[data-m]', el).forEach((b) => b.addEventListener('click', () => merchantDetail(b.dataset.m, () => VIEWS.merchants(el, ctx))));
  },

  async payouts(el, ctx, status = 'pending_approval') {
    if (ctx) {
      ctx.setHeader(t('a.p.title'), esc(t('a.p.sub')), `<button class="btn secondary" id="run-s">${icon('refresh')}<span class="btn-text">${esc(t('a.p.run'))}</span></button>`);
      $('#run-s').onclick = (e) => busy(e.currentTarget, async () => { const x = await api('POST', '/api/admin/settlements/run'); toast(t('a.p.ran', { n: x.data.length })); VIEWS.payouts(el, null, status); refreshCounts(); });
    }
    const r = await api('GET', `/api/admin/payouts${status ? '?status=' + status : ''}`);
    el.innerHTML = panel({ flush: true, body: `${tabsBar([['pending_approval', t('st.pending_approval')], ['approved', t('st.approved')], ['sending', t('st.sending')], ['sent', t('st.sent')], ['completed', t('st.completed')], ['failed', t('st.failed')], ['', t('common.all')]], status)}
      ${table([t('a.m.merchant'), t('common.asset'), t('common.amount'), t('inv.netFee'), t('po.dest'), t('common.status'), t('a.p.txErr'), ''], r.data.map((p) => [
        `<b>${esc(p.merchant_name)}</b><span class="sub">${fmtDate(p.created_at)}</span>`, assetLabel(p.asset), `<b>${num(p.amount)}</b>`, num(p.fee),
        `<span class="row" style="flex-wrap:nowrap;gap:4px"><span class="mono small" title="${esc(p.address)}">${esc(short(p.address, 8))}</span><button class="btn sm ghost icon" data-copy="${esc(p.address)}" aria-label="${esc(t('common.copy'))}">${icon('copy')}</button></span>`,
        badge(p.status),
        `${p.tx_hash ? `<span class="mono small">${esc(short(p.tx_hash, 8))}</span>` : ''}${p.error ? `<span class="sub" style="color:var(--err);white-space:normal;max-width:260px">${esc(p.error)}</span>` : ''}`,
        `<div class="row" style="flex-wrap:nowrap;justify-content:flex-end">${p.status === 'pending_approval' ? `<button class="btn sm success" data-approve="${esc(p.id)}">${esc(t('a.p.approve'))}</button>` : ''}${['pending_approval', 'approved', 'sending'].includes(p.status) ? `<button class="btn sm danger-soft" data-reject="${esc(p.id)}">${esc(t('a.p.reject'))}</button>` : ''}</div>`,
      ]), { empty: t('a.p.empty'), emptyIcon: 'payout', end: [2, 3] })}` });
    $$('[data-tab]', el).forEach((b) => b.addEventListener('click', () => VIEWS.payouts(el, null, b.dataset.tab)));
    $$('[data-approve]', el).forEach((b) => b.addEventListener('click', async () => {
      const p = r.data.find((x) => x.id === b.dataset.approve);
      const q = esc(t('a.p.approveQ', { amt: fmtAmount(p.amount), a: p.asset, addr: '§' })).replace('§', `<span class="mono" style="word-break:break-all">${esc(p.address)}</span>`);
      if (!(await confirmDialog(t('a.p.approveTitle'), q, { ok: t('a.p.approveBtn') }))) return;
      await busy(b, async () => { await api('POST', `/api/admin/payouts/${p.id}/approve`); toast(t('a.p.approved')); VIEWS.payouts(el, null, status); refreshCounts(); });
    }));
    $$('[data-reject]', el).forEach((b) => b.addEventListener('click', async () => {
      const reason = await promptDialog(t('a.p.rejectTitle'), { label: t('common.reason'), value: 'rejected by admin', help: esc(t('a.p.rejectHelp')) });
      if (reason === null) return;
      await busy(b, async () => { await api('POST', `/api/admin/payouts/${b.dataset.reject}/reject`, { reason: reason || 'rejected by admin' }); toast(t('a.p.rejected')); VIEWS.payouts(el, null, status); refreshCounts(); });
    }));
  },

  async invoices(el, ctx, status = '') {
    if (ctx) ctx.setHeader(t('a.nav.invoices'));
    const r = await api('GET', `/api/admin/invoices?limit=100${status ? '&status=' + status : ''}`);
    el.innerHTML = panel({ flush: true, body: `${tabsBar([['', t('common.all')], ['paid', t('inv.tab.paid')], ['pending', t('inv.tab.pending')], ['confirming', t('inv.tab.confirming')], ['partially_paid', t('inv.tab.partial')], ['expired', t('inv.tab.expired')]], status)}
      ${table([t('inv.price'), t('common.asset'), t('a.i.required'), t('inv.received'), t('inv.gwFee'), t('common.status'), t('common.date'), ''], r.data.map((i) => [
        `<span class="num strong">${esc(fmtAmount(i.price_amount, 2))}</span> <span class="muted small">${esc(i.price_currency)}</span>`, i.asset ? assetLabel(i.asset) : '—', num(i.pay_amount), num(i.amount_received), num(i.fee_amount),
        badge(i.status) + (i.is_late ? ` <span class="badge plain b-warn">${esc(t('st.late'))}</span>` : ''), `<span class="small text-2">${fmtDate(i.created_at)}</span>`,
        `<div class="row" style="flex-wrap:nowrap;justify-content:flex-end">${['partially_paid', 'expired'].includes(i.status) && Number(i.amount_received) > 0 ? `<button class="btn sm secondary" data-paid="${esc(i.id)}">${esc(t('a.i.accept'))}</button>` : ''}<a class="btn sm ghost icon" href="${esc(i.payment_url)}" target="_blank" rel="noopener" aria-label="${esc(t('inv.openPage'))}">${icon('external')}</a></div>`,
      ]), { empty: t('a.i.empty'), end: [2, 3, 4] })}` });
    $$('[data-tab]', el).forEach((b) => b.addEventListener('click', () => VIEWS.invoices(el, null, b.dataset.tab)));
    $$('[data-paid]', el).forEach((b) => b.addEventListener('click', async () => {
      if (!(await confirmDialog(t('a.i.acceptTitle'), esc(t('a.i.acceptQ'))))) return;
      await busy(b, async () => { await api('POST', `/api/admin/invoices/${b.dataset.paid}/mark-paid`); toast(t('common.saved')); VIEWS.invoices(el, null, status); });
    }));
  },

  async unmatched(el, ctx) {
    ctx.setHeader(t('a.nav.unmatched'), esc(t('a.u.sub')));
    const r = await api('GET', '/api/admin/deposits/unmatched');
    el.innerHTML = `${alertBox('info', esc(t('a.u.tip')))}
      ${panel({ flush: true, body: table([t('au.time'), t('common.network'), t('common.asset'), t('common.amount'), t('a.u.from'), t('a.u.to'), 'Memo', t('po.tx')], r.data.map((d) => [
        `<span class="small text-2">${fmtDate(d.detected_at)}</span>`, esc(NETWORK[d.chain] || d.chain), assetLabel(d.asset), `<b>${num(d.amount)}</b>`,
        `<span class="mono small">${esc(short(d.from_address))}</span>`, `<span class="mono small">${esc(short(d.to_address))}</span>`, `<span class="mono small">${esc(d.memo || '—')}</span>`,
        `<span class="row" style="flex-wrap:nowrap;gap:4px"><span class="mono small">${esc(short(d.tx_hash, 8))}</span><button class="btn sm ghost icon" data-copy="${esc(d.tx_hash)}" aria-label="${esc(t('common.copy'))}">${icon('copy')}</button></span>`,
      ]), { empty: t('a.u.empty'), emptyIcon: 'checkCircle', end: [3] }) })}`;
  },

  async assets(el, ctx) {
    ctx.setHeader(t('a.nav.assets'), esc(t('a.as.sub')));
    const r = await api('GET', '/api/admin/asset-settings');
    const F = ['min_amount', 'deposit_fee', 'sweep_threshold', 'payout_fee', 'hot_max'];
    el.innerHTML = panel({ flush: true, body: `<div class="table-wrap"><table><thead><tr><th>${esc(t('common.asset'))}</th>${F.map((k) => `<th title="${esc(t('a.as.' + k + 'H'))}">${esc(t('a.as.' + k))}<span class="sub" style="font-weight:400;white-space:normal;max-width:150px">${esc(t('a.as.' + k + 'H'))}</span></th>`).join('')}<th></th></tr></thead>
      <tbody>${r.data.map((a) => `<tr><td>${assetLabel(a.asset)}</td>${F.map((k) => `<td><input id="as-${esc(a.asset)}-${k}" class="ltr" style="min-width:96px;max-width:130px" inputmode="decimal" data-a="${esc(a.asset)}" data-k="${k}" value="${esc(a[k])}" aria-label="${esc(a.asset)} ${esc(t('a.as.' + k))}"></td>`).join('')}
        <td><button class="btn sm" data-save="${esc(a.asset)}">${esc(t('common.save'))}</button></td></tr>`).join('')}</tbody></table></div>` });
    $$('[data-save]', el).forEach((b) => b.addEventListener('click', () => busy(b, async () => {
      const body = { asset: b.dataset.save };
      $$(`[data-a="${b.dataset.save}"]`, el).forEach((i) => (body[i.dataset.k] = i.value.trim()));
      await api('PUT', '/api/admin/asset-settings', body);
      toast(t('a.as.saved', { a: b.dataset.save }));
    })));
  },

  async webhooks(el, ctx) {
    ctx.setHeader(t('a.nav.webhooks'), esc(t('a.w.sub')));
    const r = await api('GET', '/api/admin/webhooks/failed');
    el.innerHTML = panel({ flush: true, body: table([t('au.time'), t('au.event'), t('a.w.attempts'), t('a.w.lastErr'), ''], r.data.map((w) => [
      `<span class="small text-2">${fmtDate(w.created_at)}</span>`, `<span class="mono small">${esc(w.event)}</span>`, `<span class="num">${esc(w.attempts)}</span>`,
      `<span class="small" style="color:var(--err)">${esc(w.last_error || '')}</span>`, `<button class="btn sm secondary" data-retry="${esc(w.id)}">${icon('refresh')}${esc(t('a.w.resend'))}</button>`,
    ]), { empty: t('a.w.empty'), emptyIcon: 'checkCircle' }) });
    $$('[data-retry]', el).forEach((b) => b.addEventListener('click', () => busy(b, async () => { await api('POST', `/api/admin/webhooks/${b.dataset.retry}/retry`); toast(t('a.w.queued')); VIEWS.webhooks(el, ctx); })));
  },

  async audit(el, ctx) {
    ctx.setHeader(t('a.nav.audit'), esc(t('a.au.sub')));
    el.innerHTML = panel({ flush: true, body: auditTable((await api('GET', '/api/admin/audit')).data) });
  },

  async account(el, ctx) {
    ctx.setHeader(t('a.acc.title'));
    el.innerHTML = panel({ title: t('tfa.title'), desc: t('a.acc.desc'), body: '<div id="tfa"></div>' });
    await twoFactorSection($('#tfa'), '/api/admin', async () => { admin = await api('GET', '/api/admin/me'); VIEWS.account(el, ctx); });
  },
};

async function merchantDetail(id, onChange) {
  const d = await api('GET', `/api/admin/merchants/${id}`);
  const m = d.merchant;
  if (!platformAssets.length) await refreshCounts();
  const allowed = m.allowed_assets;
  const result = await modal({
    title: m.name, ico: 'users', wide: true,
    body: `<div class="stack">
      <form id="em" class="grid grid-2">
        ${field(t('a.m.feePct'), `<input id="em-fee" name="fee_percent" class="ltr" inputmode="decimal" value="${esc(String(m.fee_percent).replace(/\.?0+$/, ''))}">`)}
        ${field(t('a.m.status'), `<select id="em-active" name="is_active"><option value="true" ${m.is_active ? 'selected' : ''}>${esc(t('common.active'))}</option><option value="false" ${m.is_active ? '' : 'selected'}>${esc(t('st.blocked'))}</option></select>`)}
        ${field(t('set.schedule'), `<select id="em-sch" name="settlement_schedule">${['daily', 'weekly', 'manual'].map((k) => `<option value="${k}" ${k === m.settlement_schedule ? 'selected' : ''}>${esc(t('sch.' + k))}</option>`).join('')}</select>`)}
        ${field(t('set.weekday'), `<select id="em-wd" name="settlement_weekday">${t('wd').map((x, i) => `<option value="${i}" ${i === m.settlement_weekday ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>`)}
      </form>
      <div class="field"><span>${esc(t('a.m.allowed'))}</span>
        <div class="checks">${platformAssets.map((a) => `<label class="check"><input type="checkbox" id="cur-${esc(a.id)}" data-cur="${esc(a.id)}" ${!allowed || allowed.includes(a.id) ? 'checked' : ''}>${assetLabel(a.id)}<span class="muted small">${esc(a.network_name)}</span></label>`).join('')}</div>
        <span class="help">${esc(t('a.m.allowedHelp'))}</span></div>
      <div class="grid grid-2">
        <div class="field"><span>${esc(t('a.m.balances'))}</span><div class="panel">${table([t('common.asset'), t('common.amount')], d.balances.map((b) => [assetLabel(b.asset), `<b>${num(b.balance)}</b>`]), { empty: t('a.m.noBalance'), end: [1] })}</div></div>
        <div class="field"><span>${esc(t('a.m.addresses'))}</span><div class="panel">${table([t('common.asset'), t('common.address')], d.payout_addresses.map((a) => [assetLabel(a.asset), `<span class="mono small">${esc(short(a.address, 8))}</span>${a.locked_until && new Date(a.locked_until) > new Date() ? ` <span class="badge plain b-warn">${esc(t('st.held'))}</span>` : ''}`]), { empty: t('a.m.noAddr') })}</div></div>
      </div>
      <div class="row">
        <button type="button" class="btn sm secondary" data-act="settle">${icon('payout')}${esc(t('a.m.settleNow'))}</button>
        <button type="button" class="btn sm secondary" data-act="adjust">${icon('coins')}${esc(t('a.m.adjust'))}</button>
        ${m.totp_enabled ? `<button type="button" class="btn sm danger-soft" data-act="reset2fa">${esc(t('a.m.reset2fa'))}</button>` : ''}
      </div></div>`,
    buttons: [{ label: t('common.close'), value: null }, { label: t('set.saveChanges'), value: (w) => ({ ...formData($('#em', w)), cur: $$('[data-cur]', w).filter((c) => c.checked).map((c) => c.dataset.cur) }) }],
    onOpen: (w) => w.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'settle' && await confirmDialog(t('a.m.settleNow'), esc(t('a.m.settleQ')))) {
        busy(b, async () => { const r = await api('POST', `/api/admin/merchants/${id}/settle`); toast(t('a.m.settled', { n: r.data.length })); refreshCounts(); });
      }
      if (b.dataset.act === 'reset2fa' && await confirmDialog(t('a.m.reset2fa'), esc(t('a.m.resetQ')), { danger: true })) {
        busy(b, async () => { await api('POST', `/api/admin/merchants/${id}/reset-2fa`); toast(t('a.m.resetDone')); });
      }
      if (b.dataset.act === 'adjust') {
        const a = await modal({
          title: t('a.m.adjust'), ico: 'coins',
          body: `<form id="adj" class="stack">${field(t('common.asset'), `<select id="adj-asset" name="asset">${platformAssets.map((x) => `<option value="${esc(x.id)}">${esc(x.symbol)} · ${esc(x.network_name)}</option>`).join('')}</select>`)}
            ${field(t('a.m.adjAmount'), '<input id="adj-amount" name="amount" class="ltr" placeholder="10 / -10">', esc(t('a.m.adjHelp')))}${field(t('common.reason'), '<input id="adj-note" name="note" required>')}</form>`,
          buttons: [{ label: t('common.cancel'), value: null }, { label: t('common.save'), value: (w2) => formData($('#adj', w2)) }],
        });
        if (a) try { await api('POST', `/api/admin/merchants/${id}/adjust`, a); toast(t('a.m.adjDone')); } catch (err) { toast(errText(err), 'err'); }
      }
    }),
  });
  if (!result) return onChange?.();
  const all = result.cur.length === platformAssets.length;
  try {
    await api('PATCH', `/api/admin/merchants/${id}`, {
      fee_percent: Number(result.fee_percent), is_active: result.is_active === 'true', settlement_schedule: result.settlement_schedule,
      settlement_weekday: Number(result.settlement_weekday), allowed_assets: all ? null : result.cur,
    });
    toast(t('common.saved'));
  } catch (e) { toast(errText(e), 'err'); }
  onChange?.();
}

start();
</script>
</body>
</html>
