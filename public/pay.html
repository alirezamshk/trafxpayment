<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TrafxPayment</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
  .checkout { max-width: 448px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 14px; }
  .co-top { display: flex; align-items: center; gap: 12px; }
  .co-top .avatar { width: 40px; height: 40px; font-size: 16px; background: var(--surface); border: 1px solid var(--border); color: var(--text); }
  .co-top .who { min-width: 0; flex: 1; }
  .co-top .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .co-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .co-sum { padding: 18px 20px; display: flex; align-items: flex-end; gap: 12px; border-bottom: 1px solid var(--border); }
  .co-sum .amount { font-family: var(--font-en); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 600; letter-spacing: -.03em; direction: ltr; unicode-bidi: isolate; }
  .co-sum .cur { font-family: var(--font-en); color: var(--muted); font-size: 14px; margin-inline-start: 6px; }
  .co-body { padding: 18px 20px 20px; display: grid; gap: 14px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .step { display: grid; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .step .bar { height: 3px; border-radius: 3px; background: var(--sunken); }
  .step.done .bar { background: var(--ok); }
  .step.active .bar { background: var(--brand); }
  .step.active { color: var(--text); font-weight: 600; }
  .nets { display: grid; gap: 8px; }
  .net { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); transition: border-color .12s, background .12s; }
  .net:hover { border-color: var(--brand); background: var(--surface-2); }
  .net:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .net[aria-disabled="true"] { opacity: .5; cursor: default; }
  .coin { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 10.5px; color: #fff; flex: none; font-family: var(--font-mono); letter-spacing: -.02em; }
  .net .meta { flex: 1; min-width: 0; display: grid; }
  .net .meta span { font-size: 12px; color: var(--muted); }
  .net .amt { font-family: var(--font-en); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; direction: ltr; }
  .tag-low { color: var(--ok); }
  .due { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 4px 0; }
  .due .val { font-family: var(--font-en); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 600; direction: ltr; letter-spacing: -.02em; }
  .due .val small { font-size: 14px; color: var(--muted); }
  .lbl { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); font-weight: 500; margin-bottom: 6px; }
  .lbl.req { color: var(--err); }
  .qr { display: flex; justify-content: center; }
  .qr img { background: #fff; padding: 10px; border-radius: 12px; border: 1px solid var(--border); width: 184px; height: 184px; }
  .timer { display: grid; gap: 6px; }
  .timer .t-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); }
  .timer .t-row b { margin-inline-start: auto; }
  .timer .track { height: 4px; border-radius: 4px; background: var(--sunken); overflow: hidden; }
  .timer .track > div { height: 100%; background: var(--brand); transition: width 1s linear; }
  .timer.low .track > div { background: var(--warn); }
  .center { text-align: center; display: grid; justify-items: center; gap: 8px; }
  .big { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; }
  .big svg.i { width: 30px; height: 30px; stroke-width: 2.2; }
  .spin { width: 42px; height: 42px; border: 3px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: rot .9s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; width: 100%; }
  .kv:last-child { border-bottom: 0; }
  .kv span:first-child { color: var(--muted); }
  .foot { display: flex; gap: 6px; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  .foot svg.i { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="checkout">
  <div class="co-top" id="top"></div>
  <div class="co-card" id="card" aria-live="polite"><div class="co-body"><div class="skeleton" style="width:50%"></div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div></div>
  <div class="foot" id="foot"></div>
</div>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script>
'use strict';
const id = location.pathname.split('/').pop();
const COIN = { USDT: '#26a17b', TRX: '#d9252a', ETH: '#627eea', BNB: '#c99400', POL: '#7b3fe4', TON: '#0088cc' };
const LOW_FEE = { bsc: 1, ton: 1, polygon: 1 };
let inv;
const firstSeen = Date.now();

document.title = `${t('pay.title')} · TrafxPayment`;
$('#foot').innerHTML = `${icon('lock')}<span>${esc(t('pay.footer'))}</span><span class="muted">·</span>${langSwitch('btn ghost sm')}`;
const coin = (sym) => `<span class="coin" style="background:${COIN[sym] || 'var(--brand)'}">${esc(sym.slice(0, 4))}</span>`;
const steps = (stage) => `<div class="steps">${['choose', 'pay', 'confirm', 'done'].map((k, i) =>
  `<div class="step ${i < stage ? 'done' : i === stage ? 'active' : ''}"><div class="bar"></div>${esc(t('pay.step.' + k))}</div>`).join('')}</div>`;

function timerHtml() {
  const ms = new Date(inv.expires_at) - Date.now();
  if (ms <= 0) return `<div class="timer"><div class="t-row">${icon('clock')}${esc(t('pay.timeUp'))}</div></div>`;
  const total = Math.max(ms, new Date(inv.expires_at) - firstSeen, 1);
  const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
  return `<div class="timer ${ms < 5 * 60000 ? 'low' : ''}"><div class="t-row">${icon('clock')}${esc(t('pay.timeLeft'))}<b class="num">${m}:${String(s).padStart(2, '0')}</b></div>
    <div class="track"><div style="width:${Math.min(100, (ms / total) * 100)}%"></div></div></div>`;
}

function render() {
  $('#top').innerHTML = `<div class="avatar">${esc((inv.merchant_name || '?').slice(0, 1))}</div>
    <div class="who"><b>${esc(inv.merchant_name || '')}</b><span class="small muted">${esc(inv.description || t('pay.title'))}</span></div>
    <span class="badge b-ok">${esc(t('pay.secure'))}</span>`;
  const sum = `<div class="co-sum"><div><div class="eyebrow">${esc(t('pay.due'))}</div><span class="amount">${esc(fmtAmount(inv.price_amount, 2))}</span><span class="cur">${esc(inv.price_currency)}</span></div></div>`;
  const card = $('#card');

  if (inv.status === 'paid') {
    card.innerHTML = `${sum}<div class="co-body">${steps(4)}<div class="center">
      <div class="big" style="background:var(--ok-soft);color:var(--ok)">${icon('check')}</div>
      <h2>${esc(t('pay.success'))}</h2><p class="muted">${esc(t('pay.thanks'))}</p>
      <div style="width:100%"><div class="kv"><span>${esc(t('pay.gotAmount'))}</span><b class="num">${esc(fmtAmount(inv.amount_received))} ${esc(inv.asset_symbol)}</b></div>
      <div class="kv"><span>${esc(t('common.network'))}</span><span>${esc(inv.network_name)}</span></div>
      <div class="kv"><span>${esc(t('pay.ref'))}</span><span class="mono small">${esc(short(inv.id, 6))}</span></div></div>
      ${inv.success_url ? `<a class="btn block" href="${esc(inv.success_url)}">${esc(t('pay.back'))}</a><p class="small muted">${esc(t('pay.redirect'))}</p>` : ''}</div></div>`;
    if (inv.success_url) setTimeout(() => (location.href = inv.success_url), 5000);
    return;
  }
  if (inv.status === 'expired' || inv.status === 'cancelled') {
    const exp = inv.status === 'expired';
    card.innerHTML = `${sum}<div class="co-body"><div class="center">
      <div class="big" style="background:var(--sunken);color:var(--muted)">${icon(exp ? 'clock' : 'x')}</div>
      <h2>${esc(t(exp ? 'pay.expired' : 'pay.cancelled'))}</h2>${exp ? `<p class="muted">${esc(t('pay.expiredHelp'))}</p>` : ''}
      ${inv.cancel_url ? `<a class="btn secondary block" href="${esc(inv.cancel_url)}">${esc(t('pay.back'))}</a>` : ''}</div></div>`;
    return;
  }
  if (!inv.asset) {
    card.innerHTML = `${sum}<div class="co-body">${steps(0)}<h2>${esc(t('pay.choose'))}</h2>
      <div class="nets">${inv.assets.map((a) => `<button class="net" data-asset="${esc(a.id)}">${coin(a.symbol)}
        <span class="meta"><b>${esc(a.symbol)}</b><span>${esc(t('pay.onNetwork', { n: a.network_name }))}${LOW_FEE[a.network] ? ` · <span class="tag-low">${esc(t('pay.lowFee'))}</span>` : ''}</span></span>
        ${a.pay_amount ? `<span class="amt">${esc(fmtAmount(a.pay_amount))}</span>` : ''}</button>`).join('') || alertBox('warn', esc(t('pay.noMethods')))}</div>
      ${timerHtml()}</div>`;
    $$('[data-asset]').forEach((b) => b.addEventListener('click', async () => {
      if (b.getAttribute('aria-disabled') === 'true') return;
      $$('[data-asset]').forEach((x) => x.setAttribute('aria-disabled', 'true'));
      try { inv = await api('POST', `/api/public/invoices/${id}/asset`, { asset: b.dataset.asset }); render(); }
      catch (e) { toast(errText(e), 'err'); $$('[data-asset]').forEach((x) => x.removeAttribute('aria-disabled')); }
    }));
    return;
  }
  if (inv.status === 'confirming') {
    card.innerHTML = `${sum}<div class="co-body">${steps(2)}<div class="center"><div class="spin"></div>
      <h2>${esc(t('pay.received'))}</h2><p class="muted">${esc(t('pay.waiting', { n: inv.network_name, c: inv.confirmations_required }))}</p>
      <div style="width:100%"><div class="kv"><span>${esc(t('pay.inConfirm'))}</span><b class="num">${esc(fmtAmount(inv.amount_pending))} ${esc(inv.asset_symbol)}</b></div></div></div></div>`;
    return;
  }
  const remaining = inv.status === 'partially_paid' ? Math.max(0, Number(inv.pay_amount) - Number(inv.amount_received) - Number(inv.amount_pending)) : 0;
  card.innerHTML = `${sum}<div class="co-body">${steps(1)}
    ${remaining ? alertBox('warn', t('pay.partial', { r: esc(fmtAmount(remaining.toFixed(6))), s: esc(inv.asset_symbol) })) : ''}
    <div class="due"><span class="eyebrow">${esc(t('pay.sendExact'))}</span>
      <span class="val">${esc(fmtAmount(inv.pay_amount))} <small>${esc(inv.asset_symbol)}</small></span>
      <span class="row" style="justify-content:center">${coin(inv.asset_symbol)}<span class="badge b-info">${esc(t('pay.onNetwork', { n: inv.network_name }))}</span></span>
      ${inv.network_fee && Number(inv.network_fee) > 0 ? `<span class="small muted">${esc(t('pay.inclFee', { f: fmtAmount(inv.network_fee), s: inv.asset_symbol }))}</span>` : ''}</div>
    ${copyField(inv.pay_amount, { label: t('pay.copyAmount') })}
    <div><div class="lbl">${icon('wallet')}${esc(t('pay.depositAddr'))}</div>${copyField(inv.address, { label: t('pay.copyAddr') })}</div>
    ${inv.memo ? `<div><div class="lbl req">${icon('alert')}${esc(t('pay.memo'))}</div>${copyField(inv.memo, { lg: true })}</div>${alertBox('err', t('pay.memoWarn'))}` : ''}
    ${inv.qr ? `<div class="qr"><img src="${inv.qr}" alt="QR"></div>` : ''}
    ${inv.payment_uri && inv.payment_uri.startsWith('ton://') ? `<a class="btn secondary block" href="${esc(inv.payment_uri)}">${icon('external')}${esc(t('pay.openWallet'))}</a>` : ''}
    ${alertBox('warn', t('pay.onlyNet', { s: esc(inv.asset_symbol), n: esc(inv.network_name) }))}
    ${inv.permanent_address ? alertBox('info', esc(t('pay.ownAddr')), 'shield') : ''}
    ${timerHtml()}
    <p class="small muted" style="text-align:center">${esc(t('pay.autoRefresh'))}</p></div>`;
}

async function load() {
  try { inv = await api('GET', `/api/public/invoices/${id}`); render(); }
  catch (e) {
    const nf = e.status === 404;
    $('#card').innerHTML = `<div class="co-body"><div class="center"><div class="big" style="background:var(--err-soft);color:var(--err)">${icon('alert')}</div>
      <h2>${esc(t(nf ? 'pay.notFound' : 'pay.loadErr'))}</h2><p class="muted">${esc(nf ? t('pay.badLink') : errText(e))}</p></div></div>`;
    return;
  }
  if (!['paid', 'cancelled'].includes(inv.status)) setTimeout(load, 5000);
}
// Refresh only the countdown each second, so copy fields are not re-rendered under the user's finger.
setInterval(() => { const tm = $('.timer'); if (tm && inv) tm.outerHTML = timerHtml(); }, 1000);
load();
</script>
</body>
</html>
