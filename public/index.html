<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafxPayment</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
  .home { max-width: 1080px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 56px; }
  .nav-top { display: flex; align-items: center; gap: 10px; }
  .nav-top .actions { margin-inline-start: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 40px; align-items: center; }
  .hero h1 { font-size: clamp(28px, 4.4vw, 44px); line-height: 1.3; font-weight: 700; letter-spacing: -.02em; }
  :root[lang="fa"] .hero h1 { letter-spacing: 0; line-height: 1.5; }
  .hero .lead { font-size: 16.5px; color: var(--text-2); max-width: 58ch; margin: 14px 0 24px; }
  .flow { background: var(--ink-panel); border-radius: 16px; padding: 22px; color: #e6f0f3; display: grid; gap: 12px; font-size: 13px; direction: ltr;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 24px 24px; }
  .flow .ev { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; font-family: var(--font-mono); }
  .flow .ev .time { color: rgba(230,240,243,.55); }
  .flow .ev .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; }
  .tag.p { background: rgba(231,163,62,.18); color: #f0bd6c; } .tag.c { background: rgba(42,149,184,.22); color: #7cc6de; } .tag.ok { background: rgba(76,194,124,.18); color: #7fd8a3; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 20px; }
  .features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--border); }
  .feature { padding: 22px 22px 0 0; display: grid; gap: 6px; align-content: start; }
  :root[dir="rtl"] .feature { padding: 22px 0 0 22px; }
  .feature + .feature { border-inline-start: 1px solid var(--border); padding-inline-start: 22px; }
  .feature .ico { color: var(--brand); }
  @media (max-width: 820px) { .hero { grid-template-columns: minmax(0, 1fr); } .features { grid-template-columns: minmax(0, 1fr); } .feature + .feature { border-inline-start: 0; border-top: 1px solid var(--border); padding-inline-start: 0; } }
</style>
</head>
<body>
<div class="home" id="root"></div>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script>
document.title = `TrafxPayment · ${t('app.tagline')}`;
$('#root').innerHTML = `
  <div class="nav-top"><div class="brand" style="padding:0"><div class="brand-mark">${icon('bolt')}</div><div><div class="brand-name">TrafxPayment</div><div class="brand-sub">${esc(t('app.tagline'))}</div></div></div>
    <div class="actions">${langSwitch('btn ghost sm')}<a class="btn ghost sm" href="/admin">${esc(t('home.admin'))}</a><a class="btn sm" href="/panel">${esc(t('home.merchants'))}</a></div></div>
  <section class="hero">
    <div>
      <h1>${esc(t('home.title'))}</h1>
      <p class="lead">${esc(t('home.lead'))}</p>
      <div class="row"><a class="btn" href="/panel">${esc(t('home.start'))}</a><a class="btn secondary" href="/panel#developers">${esc(t('home.docs'))}</a></div>
      <div class="chips">${['USDT · TRC20', 'USDT · BEP20', 'USDT · TON', 'TRX', 'BNB', 'TON', 'ETH'].map((c) => `<span class="badge plain b-muted mono">${c}</span>`).join('')}</div>
    </div>
    <div class="flow" aria-hidden="true">
      <div class="ev"><span class="time">14:02:11</span><span>invoice.created · 249.90 USDT</span><span class="tag p">pending</span></div>
      <div class="ev"><span class="time">14:03:40</span><span>tx 7f3a…c91e · TRC20</span><span class="tag c">3/19</span></div>
      <div class="ev"><span class="time">14:04:38</span><span>invoice.paid · webhook 200</span><span class="tag ok">paid</span></div>
      <div class="ev"><span class="time">06:00:00</span><span>payout · 2,474.01 USDT</span><span class="tag ok">sent</span></div>
    </div>
  </section>
  <section class="features">
    ${[['bolt', 'home.f1'], ['code', 'home.f2'], ['shield', 'home.f3']].map(([i, k]) => `<div class="feature"><span class="ico">${icon(i)}</span><h3>${esc(t(k))}</h3><p class="muted small">${esc(t(k + 'd'))}</p></div>`).join('')}
  </section>`;
</script>
</body>
</html>
