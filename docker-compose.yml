# The signer is the only process that holds the mnemonic. For production, run it on a
# separate locked-down host (same image, `node dist/bin/signer.js`) with its own .env.signer.
#
# Everything below is driven by .env (written by install.sh):
#   COMPOSE_PROFILES=caddy      run the bundled HTTPS proxy (empty = an existing proxy forwards to the API)
#   HTTP_PORT / HTTPS_PORT      host ports for caddy (default 80/443)
#   CADDY_TLS=off               behind Cloudflare SSL "Flexible": plain HTTP on HTTP_PORT (with CADDY_SITE=http://<domain>)
#   CADDY_TLS=internal|origin   behind Cloudflare SSL "Full" / "Full (strict)"
#   API_BIND / API_PORT         where the API is published on the host (default 127.0.0.1:3000)
#   BUILD_PROXY                 proxy for image builds (npm), as seen from the host
#   DOCKERHUB / NPM_REGISTRY    mirrors for servers that cannot reach Docker Hub or npm
#   OUTBOUND_PROXY              proxy for the running services, as seen from inside containers

x-app: &app
  build:
    context: .
    network: host
    args:
      HTTP_PROXY: ${BUILD_PROXY:-}
      HTTPS_PROXY: ${BUILD_PROXY:-}
      DOCKERHUB: ${DOCKERHUB:-docker.io}
      NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
  image: trafxpayment-app
  env_file: .env
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  db:
    image: ${DOCKERHUB:-docker.io}/library/postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: trafxpayment
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["node", "dist/bin/migrate.js"]
    depends_on: { db: { condition: service_healthy } }

  api:
    <<: *app
    ports: ["${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"]
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully } }

  caddy:
    image: ${DOCKERHUB:-docker.io}/library/caddy:2-alpine
    profiles: [caddy]
    env_file: .env # DOMAIN, ACME_EMAIL, CADDY_TLS, TRUSTED_PROXIES
    environment:
      CADDY_SITE: ${CADDY_SITE:-${DOMAIN}} # http://<domain> when Cloudflare (Flexible) does HTTPS
      HTTP_PROXY: ${OUTBOUND_PROXY:-}
      HTTPS_PROXY: ${OUTBOUND_PROXY:-}
      NO_PROXY: api,localhost,127.0.0.1
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [api]

  worker:
    <<: *app
    command: ["node", "dist/bin/worker.js"]
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully } }

  signer:
    <<: *app
    env_file: [.env, .env.signer]
    command: ["node", "dist/bin/signer.js"]
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
