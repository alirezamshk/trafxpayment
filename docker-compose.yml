# The signer is the only process that holds the mnemonic. For production, run it on a
# separate locked-down host (same image, `node dist/bin/signer.js`) with its own .env.signer.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: trafxpayment
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    command: ["node", "dist/bin/migrate.js"]
    depends_on: { db: { condition: service_healthy } }

  api:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: .
    env_file: .env
    command: ["node", "dist/bin/worker.js"]
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully } }

  signer:
    build: .
    env_file: [.env, .env.signer]
    command: ["node", "dist/bin/signer.js"]
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes:
  pgdata:
